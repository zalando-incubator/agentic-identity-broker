# Development Configuration
# In-memory storage for rapid development and testing

log:
  level: debug
  format: text

storage:
  backend: memory
  timeouts:
    read: 5s
    write: 10s

approvals:
  pending_ttl: 10m
  sync_coalesce_window: 1s
  rate_limit:
    max_pending_per_pair: 50
    max_requests_per_minute: 10

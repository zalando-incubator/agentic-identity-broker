server:
  port: 9002
  bind: "0.0.0.0"

oauth2:
  # Uses the upstream-oauth2-client credentials from the mock upstream OAuth2 server
  client_id: "upstream-oauth2-client"
  client_secret: "upstream-oauth2-secret-xyz"
  redirect_uri: "http://localhost:9002/oauth2/callback"
  scopes:
    - "openid"
    - "profile"
    - "email"

broker:
  # Identity Broker configuration
  base_url: "http://localhost:8000"
  authorize_endpoint: "http://localhost:8000/oauth2/authorize"
  # Token and metadata endpoints use internal container DNS for server-to-server communication
  token_endpoint: "http://identity-broker:8000/oauth2/token"
  metadata_endpoint: "http://identity-broker:8000/.well-known/oauth-authorization-server"

agentgateway:
  # AgentGateway MCP endpoint — container DNS for server-to-server communication
  mcp_url: "http://agentgateway:4000/mcp"

# ExtProc Token Exchange Service — Docker Compose Configuration
# Reference: specs/015-extproc-token-exchange/contracts/docker-compose.md
#
# WARNING: Development/local Docker Compose use only.
# HTTP endpoints are acceptable here because all services run in the same
# Docker Compose network (aib-network) without TLS. For production, use HTTPS
# and set oauth2.tls.allow_http: false.

grpc:
  bind: "0.0.0.0"
  port: 50051
  max_concurrent_streams: 100

oauth2:
  # Identity broker's token exchange endpoint (Docker service name: identity-broker)
  token_endpoint: "http://identity-broker:8000/oauth2/token"

  # Upstream OAuth2 authorization server (Docker service name: upstream-oauth2)
  issuer: "http://upstream-oauth2:9001"

  # Client credentials — injected from Docker environment
  client_id: "extproc-gateway"
  client_secret: "${EXTPROC_CLIENT_SECRET}"

  # Token type for client assertion: "id_token" for most OAuth2 providers (Auth0, Keycloak)
  # or "access_token" if the upstream server doesn't provide id_token (e.g., mock servers)
  client_assertion_type: "access_token"

  exchange_timeout: "5s"

  tls:
    insecure_skip_verify: false
    ca_bundle_path: ""
    # Allow HTTP for local Docker Compose development
    allow_http: true

cache:
  default_ttl: "5m"
  max_ttl: "1h"

log:
  level: "${EXTPROC_LOG_LEVEL}"
  format: "json"

authorization:
  # Compose runs the bundled demo policy so the sample agent can exercise approval gating.
  enabled: true
  policy:
    config_file: "/etc/extproc/opa-config.yaml"
    package: "aib.extproc.authz"
    decision: "result"

  default_decision: "deny"
  evaluation_timeout: 100ms
  max_body_size: 1048576

tool_approvals:
  enabled: true
  url: "http://identity-broker:8000"
  long_poll_timeout_seconds: 30
  approval_cache_idle_ttl: 5m
  request_timeout: 5s
  max_staleness: 60s

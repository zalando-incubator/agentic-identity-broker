          example: agent-research-assistant
          maxLength: 255
        external_id:
          type: string
          nullable: true
          description: Optional external governance system identifier for tracking and audit
          example: gov-sys-12345
          maxLength: 255
        display_name:
          type: string
          description: Human-readable name for the agent displayed to end users
          example: Research Assistant
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Detailed description of the agent's purpose and capabilities
          example: AI assistant that helps with academic research by accessing papers and datasets
          minLength: 1
          maxLength: 1000
        governance_url:
          type: string
          format: uri
          nullable: true
          description: URL to governance and compliance information (must be HTTP/HTTPS)
          example: https://example.com/agents/research-assistant/governance
        user_documentation_url:
          type: string
          format: uri
          nullable: true
          description: URL to user-facing documentation (must be HTTP/HTTPS)

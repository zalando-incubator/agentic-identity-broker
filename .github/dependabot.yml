# Dependabot Configuration for Agentic Identity Broker
# Documentation: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Go Module Dependencies
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/infra/cdk"
      - "/mocks/*"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7
    labels:
      - "dependabot"
      - "minor"
    groups:
      go-dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Web npm Dependencies
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    labels:
      - "dependabot"
      - "minor"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      web-patch-updates:
        applies-to: "version-updates"
        update-types:
          - "patch"
        patterns:
          - "*"

  # Documentation npm Dependencies
  - package-ecosystem: "npm"
    directory: "/assets/docusaurus"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependabot"
      - "minor"
    open-pull-requests-limit: 2
    groups:
      documentation-patch-updates:
        applies-to: "version-updates"
        update-types:
          - "patch"
        patterns:
          - "*"

  # GitHub Actions — every `uses:` is pinned to a commit SHA, so this is the
  # only way those pins ever move. Grouped into one PR per week.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 3
    labels:
      - "dependabot"
      - "minor"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Container base images — pinned by digest in every Dockerfile.
  - package-ecosystem: "docker"
    directory: "/build/docker"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependabot"
      - "minor"
    groups:
      base-images:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"

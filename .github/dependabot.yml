# Dependabot Configuration for Agentic Identity Broker
# Documentation: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# Version updates run monthly; minor and patch updates are grouped, majors stay separate.
# These schedules and groups do not control security updates.

version: 2
updates:
  # Go Module Dependencies
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/infra/cdk"
      - "/mocks/*"
      - "/tools/telemetrylint"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7
    labels:
      - "dependabot"
      - "minor"
    groups:
      go-dependencies:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Web npm Dependencies
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    labels:
      - "dependabot"
      - "minor"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      web-dependencies:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Documentation npm Dependencies
  - package-ecosystem: "npm"
    directory: "/assets/docusaurus"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependabot"
      - "minor"
    open-pull-requests-limit: 2
    groups:
      documentation-dependencies:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Spec wireframe renderer npm Dependencies
  - package-ecosystem: "npm"
    directory: "/tools/wireloom"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependabot"
      - "minor"
    open-pull-requests-limit: 1
    groups:
      wireloom-dependencies:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # GitHub Actions — every `uses:` is pinned to a commit SHA, so this is the
  # only way those pins ever move. Minor and patch updates are grouped monthly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7
    labels:
      - "dependabot"
      - "minor"
    groups:
      github-actions:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Container base images — pinned by digest in every Dockerfile.
  - package-ecosystem: "docker"
    directory: "/build/docker"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependabot"
      - "minor"
    groups:
      base-images:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    commit-message:
      prefix: "chore"

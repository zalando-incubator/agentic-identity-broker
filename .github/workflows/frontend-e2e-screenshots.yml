name: Frontend E2E Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  frontend-e2e:
    runs-on: ubuntu-latest
    # Skip forked PRs — can't push back and token is read-only
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Skip if last commit is automated screenshot update
        id: skip-check
        run: |
          LAST_MSG=$(git log -1 --format="%s" HEAD)
          echo "Last commit message: $LAST_MSG"
          if [ "$LAST_MSG" = "Update frontend E2E screenshots" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: last commit is an automated screenshot update"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable Go 1.26 jsonv2 experiment
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          case "$(go env GOVERSION)" in
            go1.26.*) echo "GOEXPERIMENT=jsonv2" >> "$GITHUB_ENV" ;;
          esac

      - name: Set up Node.js
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Cache Playwright browsers
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Ginkgo
        if: steps.skip-check.outputs.skip != 'true'
        run: go install github.com/onsi/ginkgo/v2/ginkgo@v2.32.1

      - name: Install Playwright browsers
        if: steps.skip-check.outputs.skip != 'true'
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6201.1 install --with-deps

      - name: Install web dependencies
        if: steps.skip-check.outputs.skip != 'true'
        run: cd web && npm ci

      - name: Build frontend
        if: steps.skip-check.outputs.skip != 'true'
        run: cd web && npm run build

      - name: Run frontend E2E tests
        if: steps.skip-check.outputs.skip != 'true'
        id: tests
        run: E2E_FRONTEND_MODE=built E2E_CAPTURE_SCREENSHOTS=true ginkgo -v ./tests/e2e/frontend/
        continue-on-error: true

      - name: Build screenshot diff tool
        if: steps.skip-check.outputs.skip != 'true'
        run: go build -o /tmp/imgdiff ./tools/imgdiff

      - name: Sync screenshots to tracked directory (threshold comparison)
        if: steps.skip-check.outputs.skip != 'true'
        id: sync-screenshots
        run: |
          SRC="tests/e2e/frontend/coverage/screenshots"
          DEST="tests/e2e/screenshots"
          # Pixel-difference threshold (percentage). Screenshots that differ
          # by less than this amount are considered unchanged, which avoids
          # noisy commits caused by sub-pixel anti-aliasing or font-rendering
          # differences across CI runner environments.
          THRESHOLD=0.5

          if [ ! -d "$SRC" ]; then
            echo "Screenshot source directory does not exist: $SRC"
            exit 0
          fi

          NEW_FILES=$(find "$SRC" -name "*.png" -type f 2>/dev/null)
          if [ -z "$NEW_FILES" ]; then
            echo "No screenshots found in $SRC"
            exit 0
          fi

          echo "Syncing screenshots from $SRC to $DEST (threshold ${THRESHOLD}%)"
          mkdir -p "$DEST"

          # --- copy new / update changed screenshots ----------------------
          for src_file in "$SRC"/*.png; do
            name=$(basename "$src_file")
            dest_file="$DEST/$name"

            if [ ! -f "$dest_file" ]; then
              echo "  NEW   $name"
              cp "$src_file" "$dest_file"
              continue
            fi

            # imgdiff compares two PNGs pixel-by-pixel using Go's image/png
            # (same approach as Playwright's pixelmatch). Exit 0 = below
            # threshold, exit 1 = above threshold, exit 2 = error.
            pct=$(/tmp/imgdiff "$src_file" "$dest_file" "$THRESHOLD") && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "  SKIP   $name (${pct}% changed — below threshold)"
            elif [ "$rc" -eq 2 ]; then
              echo "  COPY   $name (comparison failed, copying unconditionally)"
              cp "$src_file" "$dest_file"
            else
              echo "  UPDATE $name (${pct}% changed)"
              cp "$src_file" "$dest_file"
            fi
          done

          # --- remove screenshots that no longer exist in source ----------
          for dest_file in "$DEST"/*.png; do
            [ -f "$dest_file" ] || continue
            name=$(basename "$dest_file")
            if [ ! -f "$SRC/$name" ]; then
              echo "  REMOVE $name (no longer generated)"
              rm "$dest_file"
            fi
          done

          if [ -z "$(git status --porcelain -- "$DEST")" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No screenshot changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push screenshot changes
        if: steps.skip-check.outputs.skip != 'true' && steps.sync-screenshots.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add tests/e2e/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git commit -m "Update frontend E2E screenshots"
          git push

      - name: Upload screenshots as artifact
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/*.png
          if-no-files-found: ignore

      - name: Update PR description with screenshots
        if: steps.skip-check.outputs.skip != 'true' && steps.sync-screenshots.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Get the current PR state (includes latest head SHA after any push)
            const { data: currentPR } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Compare base branch to head branch to find all changed screenshots in the PR
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${pr.base.ref}...${currentPR.head.sha}`,
            });

            const changedScreenshots = (comparison.files || []).filter(
              (f) =>
                f.filename.startsWith("tests/e2e/screenshots/") &&
                f.filename.endsWith(".png") &&
                f.status !== "removed"
            );

            if (changedScreenshots.length === 0) {
              core.info("No screenshot changes found in this PR");
              return;
            }

            // Use github.com/.../raw/ URLs — these go through GitHub's auth layer
            // and work for any authenticated user with repo access (unlike
            // raw.githubusercontent.com which requires a separate token for private repos)
            const headSha = currentPR.head.sha;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let screenshotSection = "## Screenshots\n\n";
            screenshotSection += `> [Download all screenshots (workflow artifact) ↗](${runUrl})\n\n`;
            for (const file of changedScreenshots) {
              const name = file.filename.split("/").pop().replace(".png", "").replaceAll("_", " ");
              const imgUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/raw/${headSha}/${file.filename}`;
              screenshotSection += `### ${name}\n![${name}](${imgUrl})\n\n`;
            }

            let body = currentPR.body || "";

            // Remove existing Screenshots section if present
            const screenshotsHeader = "\n## Screenshots";
            const screenshotsIdx = body.indexOf(screenshotsHeader);
            if (screenshotsIdx !== -1) {
              // Find the next ## heading after the screenshots section
              const afterHeader = body.indexOf("\n## ", screenshotsIdx + screenshotsHeader.length);
              if (afterHeader !== -1) {
                body = body.substring(0, screenshotsIdx) + body.substring(afterHeader);
              } else {
                body = body.substring(0, screenshotsIdx);
              }
              body = body.trimEnd();
            }

            // Append new screenshots section
            body += "\n\n" + screenshotSection.trimEnd();

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: body,
            });

            core.info(`Updated PR #${pr.number} with ${changedScreenshots.length} screenshot(s)`);

      - name: Fail if tests failed
        if: steps.skip-check.outputs.skip != 'true' && steps.tests.outcome == 'failure'
        run: |
          echo "Frontend E2E tests failed. See the test step for details."
          exit 1

name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "api/**"
      - "assets/docusaurus/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/docusaurus
    env:
      DOCS_SITE_URL: https://agenticidentitybroker.dev
      DOCS_GITHUB_ORG: ${{ github.repository_owner }}
      DOCS_GITHUB_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assets/docusaurus/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # noqa: E501
        with:
          path: assets/docusaurus/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        id: deployment

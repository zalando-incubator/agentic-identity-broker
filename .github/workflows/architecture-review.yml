name: Architecture Review

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  announce:
    # Skip forked PRs — GITHUB_TOKEN is read-only there
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post availability notice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "🏗️ **Architectural review available** — comment \`/architecture-review\` to trigger a structural analysis of this PR (concept overlap, hexagonal compliance, coupling, e2e coverage)."

  review:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.body == '/architecture-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Acknowledge trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            --method POST --field content='eyes'

      - name: Check for fork PR
        id: fork-check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          IS_FORK=$(gh pr view "${PR_NUMBER}" --repo "${{ github.repository }}" --json isCrossRepository --jq '.isCrossRepository')
          if [ "${IS_FORK}" = "true" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping architecture review — PR is from a fork"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.fork-check.outputs.is_fork == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch PR diff via API
        if: steps.fork-check.outputs.is_fork == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr view "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --json number,title,body,author,baseRefName,headRefName,headRefOid,changedFiles,additions,deletions,commits,labels > pr-details.json

          gh pr diff "${PR_NUMBER}" \
            --repo "${{ github.repository }}" > pr.diff

      - name: Set up Node.js
        if: steps.fork-check.outputs.is_fork == 'false'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Install Copilot CLI
        if: steps.fork-check.outputs.is_fork == 'false'
        run: npm install -g @github/copilot@1.0.86

      - name: Verify token
        if: steps.fork-check.outputs.is_fork == 'false'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN}" ]; then
            echo "::error::COPILOT_CLI_TOKEN secret is empty or not set"
            exit 1
          fi
          echo "COPILOT_CLI_TOKEN is set (${#COPILOT_GITHUB_TOKEN} chars)"
          copilot --version

      - name: Run architecture review
        if: steps.fork-check.outputs.is_fork == 'false'
        id: review
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set +e
          copilot -p "You are an architectural reviewer. Read the agent instructions at .github/agents/architecture-review.agent.md for your full review rubric. The PR diff is in pr.diff and metadata in pr-details.json — read these files using the read tool. The full repository is checked out in the current directory, so read any existing source file directly with the read tool. Do not run shell commands or git commands — use only the read, write, and task tools. Follow the sub-agent delegation strategy described in the agent instructions. When finished, write your complete architectural review in markdown format to the file review-output.md using the write tool. PR #${PR_NUMBER} in ${GITHUB_REPOSITORY}." \
            --model claude-opus-5 \
            --allow-tool=read \
            --allow-tool=write \
            --allow-tool=task \
            --no-ask-user
          REVIEW_EXIT_CODE=$?
          set -e

          if [ "${REVIEW_EXIT_CODE}" -ne 0 ]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "::error::Copilot CLI exited with code ${REVIEW_EXIT_CODE}"
            echo "⚠️ Architecture review failed (exit code ${REVIEW_EXIT_CODE}). Check workflow logs." > review-output.md
          elif [ ! -f review-output.md ] || [ ! -s review-output.md ]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "::error::Copilot CLI exited successfully but did not write review-output.md"
            echo "⚠️ Architecture review produced no output. Check workflow logs." > review-output.md
          else
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review comment
        if: always() && steps.fork-check.outputs.is_fork == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ ! -f review-output.md ]; then
            echo "⚠️ Architecture review failed before producing output. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." > review-output.md
          fi

          # GitHub comments have a 65536 char limit; truncate if needed
          if [ "$(wc -c < review-output.md)" -gt 65000 ]; then
            head -c 64000 review-output.md > review-truncated.md
            echo -e "\n\n---\n⚠️ *Review truncated due to GitHub comment size limit. See workflow run for full output.*" >> review-truncated.md
            mv review-truncated.md review-output.md
          fi

          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body-file review-output.md

      - name: React with completion status
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.fork-check.outputs.is_fork }}" = "true" ]; then
            REACTION="confused"
          elif [ "${{ steps.review.outputs.success }}" = "true" ]; then
            REACTION="rocket"
          else
            REACTION="-1"
          fi
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            --method POST --raw-field content="${REACTION}"

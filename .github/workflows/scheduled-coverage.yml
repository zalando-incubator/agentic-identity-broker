name: Coverage

on:
  workflow_dispatch:
  # Scheduled workflows run on the default branch (main).
  schedule:
    - cron: "19 4 * * 2"

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install just
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just
      - name: Install Ginkgo and Playwright
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo@v2.33.0
          go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6201.1 install --with-deps
      - name: Pre-pull E2E images
        run: |
          docker pull postgres:15-alpine@sha256:09e4f20b14ddb3dfe3a0c825b206032aaf8f28300ba2070c0b60fc1c10c6abc7
          docker pull cr.agentgateway.dev/agentgateway:v1.5.0
          docker pull testcontainers/sshd:1.4.0
          docker pull testcontainers/ryuk:0.14.0
      - name: Go unit and integration coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          package_list=$(go list -tags=integration ./...)
          packages=()
          while IFS= read -r package; do
            case "$package" in
              */tests/e2e|*/tests/e2e/*|*/web/node_modules/*) ;;
              *) packages+=("$package") ;;
            esac
          done <<< "$package_list"
          go test -tags=integration -p 2 -covermode=atomic -coverprofile=coverage/coverage.out -coverpkg=./cmd/...,./internal/... "${packages[@]}"
          go tool cover -func=coverage/coverage.out > coverage/functions.txt
          total=$(awk '/^total:/ { print $3; found = 1 } END { if (!found) exit 1 }' coverage/functions.txt)
          echo "Go unit/integration statement coverage: ${total}"
          printf 'Go unit/integration statement coverage: %s\n' "$total" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Go function coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-unit-integration-coverage-functions
          path: coverage/functions.txt
          if-no-files-found: warn
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Frontend unit coverage
        run: npm run test:coverage --prefix web
      - name: Backend E2E coverage
        run: just test-e2e-backend-coverage
      - name: ExtProc E2E coverage
        run: just test-e2e-extproc-coverage
      - name: Frontend browser and Go E2E coverage
        env:
          VITE_COVERAGE: "1"
          E2E_WEB_COVERAGE_DIR: ${{ github.workspace }}/web/coverage/browser
        run: just test-e2e-frontend-coverage
      - name: Merge browser and unit frontend coverage
        env:
          E2E_WEB_COVERAGE_DIR: ${{ github.workspace }}/web/coverage/browser
        run: npm run coverage:merge --prefix web
      - name: Upload Go unit/integration coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/coverage.out
          parallel: true
          flag-name: go-unit-integration
          coverage-reporter-version: v0.6.22
      - name: Upload Go backend E2E coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/e2e-backend.out
          parallel: true
          flag-name: go-backend-e2e
          coverage-reporter-version: v0.6.22
      - name: Upload Go ExtProc E2E coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/e2e-extproc.out
          parallel: true
          flag-name: go-extproc-e2e
          coverage-reporter-version: v0.6.22
      - name: Upload Go frontend E2E coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/e2e-frontend.out
          parallel: true
          flag-name: go-frontend-e2e
          coverage-reporter-version: v0.6.22
      - name: Upload merged frontend coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: web/coverage/lcov.info
          parallel: true
          flag-name: web-unit-browser-e2e
          coverage-reporter-version: v0.6.22
      - name: Finish complete coverage report
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true

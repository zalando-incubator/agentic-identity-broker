# OpenSSF Scorecard — supply-chain posture of the default branch.
#
# Publishes results to the OpenSSF API (badge) and to the code-scanning
# dashboard. Only meaningful on `main`; never runs on PRs.
# Checks reference: https://github.com/ossf/scorecard/blob/main/docs/checks.md

name: Scorecard

on:
  # Re-evaluate Branch-Protection when the ruleset changes.
  branch_protection_rule:
  # Keep the Maintained check fresh.
  schedule:
    - cron: "32 2 * * 5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      # Upload results to the code-scanning dashboard.
      security-events: write
      # Publish results and mint the badge.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repository: publish so the badge and the OpenSSF API are
          # kept up to date. Branch-Protection is evaluated from the public
          # ruleset API with the default token; no PAT required.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard (optional).
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif

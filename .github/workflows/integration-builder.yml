name: Integration Branch Builder

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  # ---------------------------------------------------------------------------
  # Phase 0 – Determine which "integration: *" labels the triggering PR carries.
  # Outputs a JSON array of label suffixes (e.g. '["testing","auth"]').
  # ---------------------------------------------------------------------------
  detect-labels:
    runs-on: ubuntu-latest

    # Skip fork PRs (read-only GITHUB_TOKEN) and integration PRs themselves
    # (the force-push to their branch triggers synchronize – without this
    # guard the workflow would loop).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'auto-integration-')

    outputs:
      labels: ${{ steps.detect.outputs.labels }}
      has_labels: ${{ steps.detect.outputs.has_labels }}

    permissions:
      pull-requests: read

    steps:
      - name: Detect integration labels
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_ACTION" = "labeled" ]; then
            # Only process the label that was just added.
            if [[ "$LABEL_NAME" == integration:\ * ]]; then
              name="${LABEL_NAME#integration: }"
              echo "labels=$(jq -nc --arg n "$name" '[$n]')" >> "$GITHUB_OUTPUT"
              echo "has_labels=true" >> "$GITHUB_OUTPUT"
            else
              echo "labels=[]" >> "$GITHUB_OUTPUT"
              echo "has_labels=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # For open/sync/reopen, check every label on the PR.
            labels=$(gh pr view "$PR_NUMBER" \
              --repo "$REPO" \
              --json labels \
              --jq '[.labels[].name | select(startswith("integration: ")) | ltrimstr("integration: ")]')
            count=$(echo "$labels" | jq length)
            if [ "$count" -gt 0 ]; then
              echo "labels=$labels" >> "$GITHUB_OUTPUT"
              echo "has_labels=true" >> "$GITHUB_OUTPUT"
            else
              echo "labels=[]" >> "$GITHUB_OUTPUT"
              echo "has_labels=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ---------------------------------------------------------------------------
  # Rebuild – one matrix leg per integration label.
  # Discovers open PRs that carry the same label, merges their head branches
  # into a fresh integration branch, force-pushes, and reports status.
  # ---------------------------------------------------------------------------
  rebuild:
    needs: detect-labels
    if: needs.detect-labels.outputs.has_labels == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        label: ${{ fromJson(needs.detect-labels.outputs.labels) }}

    # Only one rebuild per label at a time.
    concurrency:
      group: integration-builder-${{ matrix.label }}
      cancel-in-progress: true

    permissions:
      contents: write
      pull-requests: write

    steps:
      # Checkout main with full history so we can merge any remote branch.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all remote branches
        run: git fetch origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------
      # Discover branches – list every open PR with the matching label,
      # excluding any auto-integration-* branches (the integration PR
      # itself), then sort alphabetically for deterministic order.
      # -----------------------------------------------------------------
      - name: Collect PR branches for label
        id: branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTEGRATION_LABEL: "integration: ${{ matrix.label }}"
          REPO: ${{ github.repository }}
        run: |
          gh pr list \
            --repo "$REPO" \
            --state open \
            --label "$INTEGRATION_LABEL" \
            --json headRefName,headRepositoryOwner \
            | jq -r --arg owner "${REPO%%/*}" \
              '[.[] | select(.headRepositoryOwner.login == $owner) | .headRefName | select(startswith("auto-integration-") | not)] | sort | .[]' \
            > /tmp/branches.txt

          echo "Branches to merge:"
          cat /tmp/branches.txt

      # Reset integration branch to a clean main.
      - name: Reset integration branch to main
        env:
          LABEL: ${{ matrix.label }}
        run: |
          # Sanitize the label suffix for use as a branch name.
          # Replace any character that is not alphanumeric or a hyphen.
          # Ensure the sanitized suffix is non-empty so we always get
          # an "auto-integration-<suffix>" branch name.
          suffix="$(echo "$LABEL" | tr -cs 'a-zA-Z0-9-' '-' | sed 's/-$//')"
          if [ -z "$suffix" ]; then
            suffix="default"
          fi
          branch_name="auto-integration-$suffix"
          git checkout -B "$branch_name"
          echo "INTEGRATION_BRANCH=$branch_name" >> "$GITHUB_ENV"
          echo "INTEGRATION_SUFFIX=$suffix" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------
      # Merge conflict-resolution branches first so that manual fixes
      # are applied before any PR branch is merged. Only branches
      # scoped to this integration label suffix are included
      # (conflict-resolution/integration/<suffix>/*), discovered via
      # git ls-remote so only currently-existing remote branches are
      # merged (no stale remote-tracking refs).
      # -----------------------------------------------------------------
      - name: Merge conflict-resolution branches
        run: |
          git ls-remote --heads origin "refs/heads/conflict-resolution/integration/$INTEGRATION_SUFFIX/*" \
            | awk '{print $2}' \
            | sed 's|^refs/heads/||' \
            | sort \
            > /tmp/conflict-resolution-branches.txt

          if [ ! -s /tmp/conflict-resolution-branches.txt ]; then
            echo "No conflict-resolution branches found, skipping."
          else
            echo "Conflict-resolution branches to merge:"
            cat /tmp/conflict-resolution-branches.txt
          fi

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            echo "::group::Merging conflict-resolution branch: $branch"
            if git merge --no-edit --no-ff "origin/$branch"; then
              echo "✅ Successfully merged conflict-resolution branch $branch"
            else
              echo "::error::❌ Failed to merge conflict-resolution branch $branch – aborting."
              git merge --abort || true
              exit 1
            fi
            echo "::endgroup::"
          done < /tmp/conflict-resolution-branches.txt

      # -----------------------------------------------------------------
      # Merge every discovered PR branch. Each merge is individually
      # guarded so a single conflict cannot stop the whole rebuild.
      # Status rows are written to a temp file to avoid backtick-
      # expansion issues when passing through env vars.
      # -----------------------------------------------------------------
      - name: Merge PR branches
        id: merge
        run: |
          success=0
          failed=0
          touch /tmp/integration-status.md

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            # Strip backticks to prevent markdown injection.
            safe_branch="${branch//\`/}"
            echo "::group::Merging branch: $branch"
            if git merge --no-edit --no-ff "origin/$branch"; then
              echo "✅ Successfully merged $branch"
              echo "| ✅ | \`$safe_branch\` | Merged successfully |" >> /tmp/integration-status.md
              success=$((success + 1))
            else
              echo "::error::❌ Failed to merge $branch – aborting and continuing."
              git merge --abort || true
              echo "| ❌ | \`$safe_branch\` | Merge conflict |" >> /tmp/integration-status.md
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done < /tmp/branches.txt

          echo "success=$success" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      # Force-push the rebuilt integration branch.
      - name: Force-push integration branch
        run: git push origin "$INTEGRATION_BRANCH" --force

      # -----------------------------------------------------------------
      # Ensure an integration PR exists for this branch. If one is
      # already open, reuse it; otherwise create a new one with the
      # same "integration: *" label.
      # -----------------------------------------------------------------
      - name: Create or find integration PR
        id: integration-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTEGRATION_LABEL: "integration: ${{ matrix.label }}"
          REPO: ${{ github.repository }}
        run: |
          existing_pr=$(gh pr list \
            --repo "$REPO" \
            --head "$INTEGRATION_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing_pr" ]; then
            echo "Integration PR already exists: #$existing_pr"
            echo "number=$existing_pr" >> "$GITHUB_OUTPUT"
          else
            pr_url=$(gh pr create \
              --repo "$REPO" \
              --head "$INTEGRATION_BRANCH" \
              --base main \
              --title "🔄 Integration: ${{ matrix.label }}" \
              --body "Auto-generated integration testing branch for \`$INTEGRATION_LABEL\`. This branch is rebuilt automatically on every matching PR update." \
              --label "$INTEGRATION_LABEL")
            pr_number=$(echo "$pr_url" | grep -oE '[0-9]+$')
            if [ -z "$pr_number" ]; then
              echo "::error::Failed to extract PR number from: $pr_url"
              exit 1
            fi
            echo "Created integration PR: #$pr_number"
            echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------
      # Post a status comment on the integration PR so maintainers can
      # see exactly which branches were included in this build.
      # -----------------------------------------------------------------
      - name: Comment integration status on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.integration-pr.outputs.number }}
          SUCCESS_COUNT: ${{ steps.merge.outputs.success }}
          FAILED_COUNT: ${{ steps.merge.outputs.failed }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
          TRIGGER_ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## 🔄 Integration Build Status"
            echo ""
            echo "**Branch:** \`$INTEGRATION_BRANCH\`"
            echo "**Triggered by:** PR #$TRIGGER_PR ($TRIGGER_ACTION)"
            echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| Status | Branch | Details |"
            echo "|--------|--------|---------|"
            cat /tmp/integration-status.md
            echo ""
            echo "**Summary:** $SUCCESS_COUNT merged, $FAILED_COUNT failed"
          } > /tmp/comment-body.md

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/comment-body.md

# Release — build, publish and attest every artifact for a tag.
#
# Only runs for `v*.*.*` tags. Nothing here depends on PR-time workflows.
# Compared with the previous version it additionally:
#   - attaches the binaries, Helm chart and checksums to the GitHub Release,
#   - emits SLSA build provenance for every image (pushed to GHCR alongside
#     the image) and for the release assets (attached as a Sigstore bundle,
#     which Scorecard's Signed-Releases check recognises), and
#   - includes an SBOM and max-detail provenance in each image's attestations.
# Verify with:  gh attestation verify oci://ghcr.io/<org>/<image>:vX.Y.Z --owner <org>
#               gh attestation verify <asset> --owner <org>

name: Release

on:
  push:
    tags: ["v*.*.*"]

# Never cancel a release that is half-way through pushing images.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # create the GitHub Release and upload assets
      packages: write      # push images and the chart to GHCR
      id-token: write      # Sigstore keyless signing for the attestations
      attestations: write  # store attestations on GitHub
    env:
      TAG: ${{ github.ref_name }}

    # Because this workflow builds and publishes release artifacts, we
    # intentionally disable caching to prevent cache poisoning during builds.
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install web dependencies
        run: just web-ci

      - name: Build release artifacts
        run: just build-linux-amd64 build-linux-arm64 extproc-build-linux-amd64 extproc-build-linux-arm64 web-build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract broker metadata
        id: broker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
          labels: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker
            org.opencontainers.image.description=Identity broker for AI agents with OAuth2 delegation and consent management
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}
          annotations: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker
            org.opencontainers.image.description=Identity broker for AI agents with OAuth2 delegation and consent management
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Extract migrate metadata
        id: migrate-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}-migrate
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
          labels: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker - Migrations
            org.opencontainers.image.description=Database migration tool for Agentic Identity Broker (golang-migrate)
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}
          annotations: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker - Migrations
            org.opencontainers.image.description=Database migration tool for Agentic Identity Broker (golang-migrate)
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Extract ExtProc metadata
        id: extproc-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}-extproc
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
          labels: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker - ExtProc Token Exchange
            org.opencontainers.image.description=Envoy External Processing service for transparent Bearer token exchange
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}
          annotations: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker - ExtProc Token Exchange
            org.opencontainers.image.description=Envoy External Processing service for transparent Bearer token exchange
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}

      # --- Images ---------------------------------------------------------
      # `provenance: mode=max` + `sbom: true` attach BuildKit attestations to
      # the image index; attest-build-provenance additionally records a
      # GitHub-verifiable SLSA provenance and pushes it to the registry.

      - name: Build and push broker image
        id: broker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.broker-meta.outputs.tags }}
          labels: ${{ steps.broker-meta.outputs.labels }}
          annotations: ${{ steps.broker-meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Attest broker image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.broker.outputs.digest }}
          push-to-registry: true

      - name: Build and push migrate image
        id: migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.migrate-meta.outputs.tags }}
          labels: ${{ steps.migrate-meta.outputs.labels }}
          annotations: ${{ steps.migrate-meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Attest migrate image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-migrate
          subject-digest: ${{ steps.migrate.outputs.digest }}
          push-to-registry: true

      - name: Build and push ExtProc image
        id: extproc
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.extproc
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.extproc-meta.outputs.tags }}
          labels: ${{ steps.extproc-meta.outputs.labels }}
          annotations: ${{ steps.extproc-meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Attest ExtProc image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-extproc
          subject-digest: ${{ steps.extproc.outputs.digest }}
          push-to-registry: true

      # --- Helm chart ----------------------------------------------------

      - name: Package and push Helm chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          release_version="${TAG#v}"
          sed -i -E "s/^version:.*/version: ${release_version}/" charts/agentic-identity-broker/Chart.yaml
          sed -i -E "s/^appVersion:.*/appVersion: \"${release_version}\"/" charts/agentic-identity-broker/Chart.yaml
          helm lint charts/agentic-identity-broker
          helm package charts/agentic-identity-broker --destination dist
          helm push "dist/agentic-identity-broker-${release_version}.tgz" "oci://ghcr.io/${OWNER}"

      # --- Release assets --------------------------------------------------

      - name: Package release assets
        run: |
          set -euo pipefail
          release_version="${TAG#v}"
          for arch in amd64 arm64; do
            for bin in agentic-identity-broker extproc-token-exchange; do
              tar -C "bin/linux/${arch}" -czf "dist/${bin}_${release_version}_linux_${arch}.tar.gz" "${bin}"
            done
          done
          (cd dist && sha256sum -- *.tar.gz *.tgz > checksums.txt)
          ls -l dist

      - name: Attest release assets
        id: attest-assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tgz
            dist/checksums.txt

      - name: Add provenance bundle to release assets
        env:
          BUNDLE: ${{ steps.attest-assets.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/agentic-identity-broker_${TAG#v}_provenance.sigstore.json"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ### Container images

          - Broker: \`ghcr.io/${REPO}:${TAG}\`
          - Migrations: \`ghcr.io/${REPO}-migrate:${TAG}\`
          - ExtProc: \`ghcr.io/${REPO}-extproc:${TAG}\`
          - Helm chart: \`oci://ghcr.io/${OWNER}/agentic-identity-broker\`

          All images and the attached assets carry SLSA build provenance:
          \`gh attestation verify oci://ghcr.io/${REPO}:${TAG} --owner ${OWNER}\`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; only refreshing assets."
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber

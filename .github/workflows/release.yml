name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    # Because this workflow builds and publishes release artifacts, we
    # intentionally disable caching to prevent cache poisoning during builds.
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780
        with:
          tool: just

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Install web dependencies
        run: just web-ci

      - name: Build release artifacts
        run: just build-linux-amd64 build-linux-arm64 extproc-build-linux-amd64 extproc-build-linux-arm64 web-build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: >-
          docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract broker metadata
        id: broker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
          labels: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker
            org.opencontainers.image.description=Identity broker for AI agents with OAuth2 delegation and consent management
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}
          annotations: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker
            org.opencontainers.image.description=Identity broker for AI agents with OAuth2 delegation and consent management
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Extract migrate metadata
        id: migrate-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}-migrate
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
          labels: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker - Migrations
            org.opencontainers.image.description=Database migration tool for Agentic Identity Broker (golang-migrate)
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}
          annotations: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker - Migrations
            org.opencontainers.image.description=Database migration tool for Agentic Identity Broker (golang-migrate)
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Extract ExtProc metadata
        id: extproc-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}-extproc
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
          labels: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker - ExtProc Token Exchange
            org.opencontainers.image.description=Envoy External Processing service for transparent Bearer token exchange
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}
          annotations: |
            maintainer=Magnus Jungsbluth <magnus.jungsbluth@zalando.de>, Jan Brennenstuhl <jan.brennenstuhl@zalando.de>
            org.opencontainers.image.title=Agentic Identity Broker - ExtProc Token Exchange
            org.opencontainers.image.description=Envoy External Processing service for transparent Bearer token exchange
            org.opencontainers.image.vendor=Zalando SE
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push broker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.broker-meta.outputs.tags }}
          labels: ${{ steps.broker-meta.outputs.labels }}
          annotations: ${{ steps.broker-meta.outputs.annotations }}

      - name: Build and push migrate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.migrate-meta.outputs.tags }}
          labels: ${{ steps.migrate-meta.outputs.labels }}
          annotations: ${{ steps.migrate-meta.outputs.annotations }}

      - name: Build and push ExtProc image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.extproc
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.extproc-meta.outputs.tags }}
          labels: ${{ steps.extproc-meta.outputs.labels }}
          annotations: ${{ steps.extproc-meta.outputs.annotations }}

      - name: Package and push Helm chart
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version:.*/version: ${release_version}/" charts/agentic-identity-broker/Chart.yaml
          sed -i -E "s/^appVersion:.*/appVersion: \"${release_version}\"/" charts/agentic-identity-broker/Chart.yaml
          helm lint charts/agentic-identity-broker
          helm package charts/agentic-identity-broker --destination dist
          helm push "dist/agentic-identity-broker-${release_version}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          cat <<'EOF' > release-notes.md
          ### Container images

          - Broker: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
          - Migrations: `ghcr.io/${{ github.repository }}-migrate:${{ github.ref_name }}`
          - ExtProc: `ghcr.io/${{ github.repository }}-extproc:${{ github.ref_name }}`
          - Helm chart: `oci://ghcr.io/${{ github.repository_owner }}/agentic-identity-broker`
          EOF

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file release-notes.md

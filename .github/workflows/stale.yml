name: "Handle Stale Pull Requests"

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows running manually from the Actions tab

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Manage the saved progress cache between runs.
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Timing configurations (in days)
          days-before-pr-stale: 30
          days-before-pr-close: 7

          # Messages
          stale-pr-message: 'This PR has been automatically marked as stale because it has had no recent activity in the last 30 days. It will be closed in 7 days if no further activity occurs.'
          close-pr-message: 'This PR was closed because it has been inactive for 7 days since being marked as stale.'

          # Label settings
          stale-pr-label: 'stale'

          # Optional exemptions
          exempt-pr-labels: 'pinned, keep-open, do-not-close'
          ignore-pr-updates: false # Reset stale timer if someone updates the PR

          # Disable issue processing if you only want to handle PRs
          days-before-issue-stale: -1
          days-before-issue-close: -1

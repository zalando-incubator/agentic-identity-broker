# CodeQL — static application security testing (SAST).
#
# Runs on every PR because GitHub code scanning is inherently diff-aware:
# on a PR it only surfaces alerts that the PR *introduces*; the baseline of
# main is reported on the Security tab instead. That makes it the one
# security check that can run on PRs without echoing pre-existing findings.
#
# It is also the only SAST tool the OpenSSF Scorecard recognises, and the
# SAST check wants it on (nearly) every merged PR, so there is no path filter.
# It is intentionally NOT a required status check; its severity threshold for
# failing a PR is configured under Settings → Code security → Code scanning.

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          # go/log-injection is excluded because every log record goes through a
          # log/slog JSON or text handler, which escapes line breaks in the message
          # and in attribute values (coding-standards/LOGGING.md section 7). The
          # query does not model that escaping and re-reports every touched log line.
          # forbidigo in .golangci.yml blocks log output that bypasses slog.
          config: |
            query-filters:
              - exclude:
                  id: go/log-injection
            paths-ignore:
              - web/node_modules
              - web/dist
              - assets/docusaurus/build
              - assets/docusaurus/node_modules
              - tests/e2e/screenshots

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

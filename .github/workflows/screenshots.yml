# Screenshot candidates require human review before they become tracked baselines.
name: Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "web/**"
      - "tests/e2e/frontend/**"
      - "tests/e2e/pages/**"
      - "tests/e2e/screenshots/**"
      - "tools/imgdiff/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-e2e:
    name: Capture screenshot review candidates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: playwright-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo@v2.32.2
      - name: Install Playwright browsers
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6201.1 install --with-deps chromium
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build frontend
        run: npm --prefix web run build
      - name: Capture frontend journeys
        run: E2E_FRONTEND_MODE=built E2E_CAPTURE_SCREENSHOTS=true ginkgo -v --procs=1 --timeout=20m ./tests/e2e/frontend/
      - name: Upload screenshot review candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshot-candidates-${{ github.event.pull_request.head.sha }}
          path: tests/e2e/frontend/coverage/screenshots/*.png
          if-no-files-found: error

  storybook:
    name: Capture component review candidates
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 30
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install just
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: just
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Capture canonical component review references
        run: just web-storybook-visual-candidates
      - name: Upload component review candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-candidates-${{ github.event.pull_request.head.sha }}
          path: web/.storybook/candidates/
          if-no-files-found: error

version: "2017-09-20"
allow_concurrent_pipelines: false
allow_concurrent_steps: true

tags:
  application: agentic-identity-broker

pipeline:
  - id: test-unit
    type: script
    when:
      - event: pull_request
      - branch:
          - main
          - dev
        event: push
    vm_config:
      type: linux
      size: large
      image: cdp-runtime/go-1.27
    cache:
      paths:
        - /go/pkg/mod
        - /go/bin
        - ~/.npm
        - ~/.cache/ms-playwright
        - ~/.cache/ms-playwright-go
        - ~/.cache/golangci-lint
      size_limit_megabytes: 4096
    commands:
      - desc: "Install pre-requisites"
        cmd: |
          apt-get update
          apt-get --yes install just curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get --yes install nodejs
          just install-tools
          just web-ci
      - desc: "Run quality checks"
        cmd: |
          just check
      - desc: "Run unit suites"
        cmd: |
          cdp-wrap-cmd "just verify-unit-junit" \
            "cdp-tool upload-test-results -t junit \
              $(pwd)/test-results/unit-junit.xml"
      - desc: "Run artifacts build test"
        cmd: |
          just build-all
          test -f web/dist/index.html

  - id: test-integration
    type: script
    when:
      - event: pull_request
      - branch:
          - main
          - dev
        event: push
    vm_config:
      type: linux
      size: large
      image: cdp-runtime/go-1.27
    cache:
      paths:
        - /go/pkg/mod
        - /go/bin
        - ~/.npm
        - ~/.cache/ms-playwright
        - ~/.cache/ms-playwright-go
      size_limit_megabytes: 4096
    commands:
      - desc: "Install pre-requisites"
        cmd: |
          apt-get update
          apt-get --yes install just curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get --yes install nodejs
          just install-tools
      - desc: "Run integration suites"
        cmd: |
          cdp-wrap-cmd "just verify-integration-junit" \
            "cdp-tool upload-test-results -t junit \
              $(pwd)/test-results/integration-junit.xml"

  - id: test-e2e-backend
    type: script
    when:
      - event: pull_request
      - branch:
          - main
          - dev
        event: push
    vm_config:
      type: linux
      size: large
      image: cdp-runtime/go-1.27
    cache:
      paths:
        - /go/pkg/mod
        - /go/bin
        - ~/.npm
        - ~/.cache/ms-playwright
        - ~/.cache/ms-playwright-go
      size_limit_megabytes: 4096
    commands:
      - desc: "Install pre-requisites"
        cmd: |
          apt-get update
          apt-get --yes install just curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get --yes install nodejs
          just install-tools
          just web-ci
      - desc: "Run backend E2E suite"
        cmd: |
          GINKGO_BACKEND_PROCS=4 cdp-wrap-cmd "just verify-e2e-backend-junit" \
            "cdp-tool upload-test-results -t junit \
              $(pwd)/test-results/e2e-backend-junit.xml"

  - id: test-e2e-extproc
    type: script
    when:
      - event: pull_request
      - branch:
          - main
          - dev
        event: push
    vm_config:
      type: linux
      size: large
      image: cdp-runtime/go-1.27
    cache:
      paths:
        - /go/pkg/mod
        - /go/bin
        - ~/.cache/ms-playwright
        - ~/.cache/ms-playwright-go
      size_limit_megabytes: 4096
    commands:
      - desc: "Install pre-requisites"
        cmd: |
          apt-get update
          apt-get --yes install just curl ca-certificates
          just install-tools
      - desc: "Run ExtProc E2E suite"
        cmd: |
          GINKGO_EXTPROC_PROCS=4 cdp-wrap-cmd "just verify-e2e-extproc-junit" \
            "cdp-tool upload-test-results -t junit \
              $(pwd)/test-results/e2e-extproc-junit.xml"

  - id: test-e2e-frontend
    type: script
    when:
      - event: pull_request
      - branch:
          - main
          - dev
        event: push
    vm_config:
      type: linux
      size: large
      image: cdp-runtime/go-1.27
    cache:
      paths:
        - /go/pkg/mod
        - /go/bin
        - ~/.npm
        - ~/.cache/ms-playwright
        - ~/.cache/ms-playwright-go
      size_limit_megabytes: 4096
    commands:
      - desc: "Install pre-requisites"
        cmd: |
          apt-get update
          apt-get --yes install just curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get --yes install nodejs
          just install-tools
          just web-ci
      - desc: "Run frontend E2E suite"
        cmd: |
          GINKGO_FRONTEND_PROCS=2 E2E_CAPTURE_SCREENSHOTS=false \
            cdp-wrap-cmd "just verify-e2e-frontend-junit" \
              "cdp-tool upload-test-results -t junit \
                $(pwd)/test-results/e2e-frontend-junit.xml"

  - id: release
    depends_on: [test-unit, test-integration, test-e2e-backend, test-e2e-extproc, test-e2e-frontend]
    type: script
    when:
      branch:
        - main
        - dev
      event: push
    vm_config:
      type: linux
      image: cdp-runtime/go-1.27
    cache:
      paths:
        - /go/pkg/mod
        - ~/.npm
      size_limit_megabytes: 2048
    commands:
      - desc: "Publish internal release images and tag"
        cmd: |
          set -eu
          apt-get update
          apt-get --yes install just curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get --yes install nodejs
          just install-tools
          just web-ci
          docker buildx create --config /etc/cdp-buildkitd.toml \
            --driver-opt network=host --bootstrap --use

          LATEST_VERSION="$(git tag --merged HEAD --list 'v*.*.*' --sort=-version:refname | sed -n '1p')"
          CURRENT_MINOR="$(printf '%s' "${LATEST_VERSION}" | cut -d. -f1,2)"
          VERSION_PART="$(tr -d '[:space:]' < VERSION)"
          PATCH="$(printf '%s' "${LATEST_VERSION}" | cut -d. -f3)"
          if [ "${CURRENT_MINOR}" = "${VERSION_PART}" ]; then
            RELEASE_VERSION="${VERSION_PART}.$((PATCH + 1))"
          else
            RELEASE_VERSION="${VERSION_PART}.0"
          fi

          IMAGE_NAME="${CDP_REGISTRY}/infosec/agentic-identity-broker"
          export BASE_IMAGE="container-registry.zalando.net/library/alpine-3:latest"
          if [ -z "${CDP_PULL_REQUEST_NUMBER:-}" ]; then
            VERSION="${RELEASE_VERSION}" IMAGE_NAME="${IMAGE_NAME}" \
              just docker-push
            git gh-tag "${RELEASE_VERSION}"
            VERSION="${RELEASE_VERSION}" IMAGE_NAME="${IMAGE_NAME}" \
              just docker-promote
          else
            VERSION="${RELEASE_VERSION}" IMAGE_NAME="${IMAGE_NAME}" \
              just docker-build-all
          fi

# Air configuration for hot-reload development
# See https://github.com/air-verse/air for full documentation

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Rebuild both served artifacts from the current source.
  cmd = "npm --prefix web run build && go build -o ./tmp/agentic-identity-broker ./cmd/agentic-identity-broker"

  # The wrapper seeds local mock data after the broker starts.
  bin = "scripts/start-broker.sh"

  # Customize binary arguments
  args_bin = []

  # Watch these filename extensions
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml", "env", "ts", "tsx", "css", "js", "json", "svg", "png", "jpg", "jpeg", "webp", "avif", "ico", "woff", "woff2"]

  # Ignore these filename extensions or directories
  exclude_dir = ["tmp", "vendor", "testdata", "bin", "coverage", "node_modules", ".git", "web/dist", "web/storybook-static", "web/.storybook", "web/.vitest-attachments"]

  include_dir = ["cmd", "internal", "scripts", "migrations", "mocks", "web"]

  # Exclude files
  exclude_file = []

  # Exclude specific regular expressions
  exclude_regex = ["_test.go", "\\.test\\.[jt]sx?$", "\\.stories\\.[jt]sx?$"]

  # Exclude unchanged files
  exclude_unchanged = false

  # Follow symlinks
  follow_symlink = false

  # This log file places in your tmp_dir
  log = "build-errors.log"

  # Use fsnotify for native development (much faster than polling)
  # For Docker Compose, use build/air/.air.docker.toml with polling enabled
  poll = false

  # Delay after a detected file change before rebuilding (milliseconds)
  delay = 1000

  # Stop running old binary when build errors occur
  stop_on_error = true

  # Send Interrupt signal before killing process (windows does not support this feature)
  send_interrupt = true

  # Kill process timeout (milliseconds)
  kill_delay = 500

  # Rerun binary or not
  rerun = false

  # Delay after each execution (milliseconds)
  rerun_delay = 500

  # Add additional arguments when running binary (bin/full_bin). Will run './tmp/agentic-identity-broker hello world'
  # args_bin = ["hello", "world"]

[log]
  # Show log time
  time = true

  # Only show main log (silences watcher, build, runner)
  main_only = false

[color]
  # Customize each part's color. If no color found, use the raw app log.
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true

[screen]
  # Clear the screen before each build
  clear_on_rebuild = true

  # Enable truecolor support
  keep_scroll = true

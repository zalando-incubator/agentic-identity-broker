# Portable target-deployment input: the Secret reference needs no cluster or real credentials to render.
broker:
  thirdPartyOauth2:
    credentialFiles:
      zalando-platform:
        client_id_file: /meta/credentials/employee-client-id
        client_secret_file: /meta/credentials/employee-client-secret
  extraVolumes:
    - name: agentic-platform-credentials
      secret:
        secretName: agentic-platform-credentials
        defaultMode: 0444
  extraVolumeMounts:
    - name: agentic-platform-credentials
      mountPath: /meta/credentials
      readOnly: true

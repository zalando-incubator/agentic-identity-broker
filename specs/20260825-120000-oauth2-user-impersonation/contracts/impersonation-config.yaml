# Configuration Contract: OAuth2 User Impersonation
#
# Feature: 20260825-120000-oauth2-user-impersonation
# Binding config contract for oauth2_authorization_server.impersonation.
# Startup validation is fail-closed (CR-001..CR-008); every value is available through the
# broker's established configuration sources. Local mode only.
#
# SCOPE: This is a CONFIG OVERLAY / SNIPPET, NOT a bootable config. It shows only the
# oauth2_authorization_server subtree relevant to impersonation. The broker's top-level Config
# additionally REQUIRES log, server, and storage (validate:"required" in internal/ports/config.go)
# and needs an encryption block for local signing keys. To run, merge this subtree into a complete
# config (e.g. examples/config/oauth2-server-mode.yaml local-mode base + encryption). The full
# bootable FR-014 example is delivered during implementation as examples/config/impersonation.yaml.

oauth2_authorization_server:
  mode: local
  local:
    issuer_uri: "https://broker.example.com"
    token_ttl: "1h"
    # The existing local-token policy owns emitted claims. It receives the audience-selected
    # target as `agent`; this example emits aud and omits email when unavailable.
    token_claims_expression: |
      principal.email == "" ? {"aud": "https://policy.example.com"} : {
        "aud": "https://policy.example.com", "email": principal.email
      }

  impersonation:
    # CR-001: routing-only URI prefix for the RFC 8693 request `audience`.
    # A request activates impersonation only with exactly one target suffix that is the target
    # agent's canonical lower-case UUID or canonical_id. This prefix is distinct from each signed
    # credential's `expected_audience` and is never copied to an issued token's `aud`.
    audience_prefix: "https://broker.example.com/impersonation"

    # CR-002: non-empty, ordered; evaluated first-match (FR-004a).
    rules:

      # -------- Rule 1: signed subject token from an internal IdP --------
      - name: "internal-gateway-signed-subject"

        # Role SEMANTICS, declared once per role (CR-003), keyed by role name so a role cannot be
        # declared twice. `expected_audience` MAY differ per role; kept consistent here. Field name
        # matches token_exchange / jwt (`expected_audience`); extraction matches ClaimExtractionConfig
        # (`principal_expression` / `email_expression`).
        roles:
          client_assertion:
            expected_audience: "https://broker.example.com/impersonation"
            principal_expression: "client_assertion.sub"
          actor:
            expected_audience: "https://broker.example.com/impersonation"
            principal_expression: "actor_token.sub"
          subject:
            # verification defaults to "jwks": signed subject validated against a trusted issuer.
            expected_audience: "https://broker.example.com/impersonation"
            principal_expression: "subject_token.sub"
            email_expression: "has(subject_token.email) ? subject_token.email : ''"

        # Trust ANCHORS only (CR-007/CR-008): issuer + JWKS + algorithms + which roles it may sign.
        # JWKS field names are verbatim from ClientAssertionTrustConfig.
        trusted_issuers:
          - issuer_uri: "https://idp.internal.example.com"
            # jwks_uri omitted -> discovered from issuer metadata.
            jwks_min_refresh: "15m"
            jwks_max_refresh: "1h"
            allowed_algorithms: ["ES256", "RS256"]   # CR-007: asymmetric only; no HS*/none
            signs_roles: ["client_assertion", "actor", "subject"]

        # CR-005: symmetric with token_exchange AuthorizationConfig (type + cel.expression).
        authorization:
          type: cel
          cel:
            expression: |
              client_assertion.iss == "https://idp.internal.example.com" &&
              client_assertion.sub in ["gateway-prod", "gateway-staging"]
            evaluation_timeout: "100ms"

      # -------- Rule 2: unverified (unsigned) subject from a chat bridge --------
      # Same client-assertion issuer reused across rules (permitted; CR-008 uniqueness is scoped
      # WITHIN a rule, not across).
      - name: "chat-bridge-unverified-subject"

        roles:
          client_assertion:
            expected_audience: "https://broker.example.com/impersonation"
            principal_expression: "client_assertion.sub"
          actor:
            expected_audience: "https://broker.example.com/impersonation"
            principal_expression: "actor_token.sub"
          subject:
            # CR-005a: unsigned unverified subject (ADR 20260825-120000). No signing issuer, so `subject` is
            # absent from every signs_roles; `expected_audience` is forbidden (nothing signed to bind
            # aud to); the authorization predicate MUST reference `subject_token`.
            verification: none
            principal_expression: "subject_token.sub"
            email_expression: "has(subject_token.email) ? subject_token.email : ''"

        trusted_issuers:
          - issuer_uri: "https://idp.internal.example.com"
            jwks_min_refresh: "15m"
            jwks_max_refresh: "1h"
            allowed_algorithms: ["ES256", "RS256"]
            signs_roles: ["client_assertion", "actor"]

        authorization:
          type: cel
          cel:
            expression: |
              client_assertion.sub == "chat-bridge-prod" &&
              subject_token.sub.startsWith("slack|") &&
              (
                !has(subject_token.email) ||
                subject_token.email.endsWith("@example.com")
              )
            evaluation_timeout: "100ms"

# ---------------------------------------------------------------------------
# Startup validation contract (fail-closed):
#   CR-001  audience_prefix is an absolute HTTP(S) URI with host, no userinfo/query/fragment,
#           and no trailing slash. It routes `<audience_prefix>/<agent UUID or canonical ID>`
#           requests.
#   CR-003  each rule: unique name; roles map keys subset of {client_assertion, actor, subject};
#           MUST define client_assertion, actor, and subject; each role requires
#           principal_expression; email_expression and verification allowed on subject only
#           (verification in {jwks (default), none}); expected_audience REQUIRED when subject
#           verification is jwks, FORBIDDEN when none.
#   CR-004  local issuer_uri MUST NOT be a trusted issuer that signs the client_assertion role.
#   CR-005  authorization.type == "cel"; authorization.cel.expression required, compiles at startup;
#           empty fails; authorization.cel.evaluation_timeout in [10ms,5s], default 100ms.
#   CR-005a a subject whose verification is none requires the predicate to reference subject_token
#           (verified from the compiled expression); else startup fails.
#   CR-006  impersonation block rejected outside local mode.
#   CR-007  allowed_algorithms subset of {RS256,RS384,RS512,PS256,PS384,PS512,ES256,ES384,ES512,EdDSA};
#           none and HS* rejected.
#   CR-008  within a rule: issuer_uri unique across trusted_issuers; every signs_roles entry is a
#           defined signed role; each signed role (client_assertion, actor, and subject when its
#           verification is jwks) is covered by at least one trusted issuer's signs_roles; a subject
#           whose verification is none MUST NOT appear in any signs_roles. Duplicates across rules OK.
# Every failure yields an actionable domain/config.ConfigError with an indexed field path, e.g.
#   oauth2_authorization_server.impersonation.rules[1].trusted_issuers[0].allowed_algorithms
# ---------------------------------------------------------------------------

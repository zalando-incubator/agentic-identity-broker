openapi: 3.0.3
info:
  title: Permission Sets — End-User API Contract (019)
  version: 1.0.0
  description: |
    > **ARCHIVED — provisional draft, superseded by `/api/enduser/openapi.yaml`.**
    > This file predates the positive-inclusion model change and may contradict the
    > authoritative spec. Do not rely on schemas here for implementation.

    End-user API modifications for the Permission Sets feature (spec 019).
    These changes are merged into `/api/enduser/openapi.yaml`.

    ## Modified Endpoints

    1. `GET /api/consent/agents/{id}/consent-info` — response extended with resolved `permission_sets`
    2. `POST /api/consent/agents/{id}/grants` — request accepts `granted_permission_set_ids`; response updated
    3. `POST /oauth2/token` — response extended with `granted_permission_set_ids`

servers:
  - url: http://localhost:8000
    description: End-user server

tags:
  - name: Consent
    description: Consent management endpoints
  - name: OAuth2
    description: OAuth2 token exchange

paths:
  /api/consent/agents/{id}/consent-info:
    get:
      tags: [Consent]
      summary: Get agent consent information (extended)
      operationId: getAgentConsentInfo
      description: |
        Returns the agent's details needed to render the consent screen.

        **Permission Sets change (019)**:
        The response now includes a `permission_sets` list of resolved permission set objects
        with their `requirement_type`, in agent-declaration order. This is rendered as the
        "Agent Permissions" section above the service connections section.

        Active session service IDs are also included so the frontend can show each
        service's connection status and omit connection actions for active services.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent consent information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConsentInfoResponse'
              example:
                agent:
                  id: "agent-uuid"
                  client_id: "my-ai-agent"
                  display_name: "My AI Agent"
                  description: "An AI assistant"
                  service_requirements:
                    - service_id: "service-uuid-1"
                      requirement_type: "mandatory"
                      required_scopes: ["repo:read"]
                    - service_id: "service-uuid-2"
                      requirement_type: "optional"
                      required_scopes: ["calendar.read"]
                permission_sets:
                  - permission_set:
                      id: "ps-uuid-1"
                      name: "GitHub Read Access"
                      description: "Read repository contents and user profile"
                      service_scopes:
                        - service_id: "service-uuid-1"
                          requirement_type: "mandatory"
                    requirement_type: "mandatory"
                  - permission_set:
                      id: "ps-uuid-2"
                      name: "Calendar View"
                      description: "View calendar events"
                      service_scopes:
                        - service_id: "service-uuid-2"
                          requirement_type: "optional"
                    requirement_type: "optional"
                active_session_service_ids:
                  - "service-uuid-1"
                available_services:
                  - id: "service-uuid-1"
                    display_name: "GitHub"
                  - id: "service-uuid-2"
                    display_name: "Google"
        '404':
          description: Agent not found

  /api/consent/agents/{id}/grants:
    post:
      tags: [Consent]
      summary: Submit consent grant (modified)
      operationId: createGrant
      description: |
        Stores the user's consent grant. The request body must contain:
        - `granted_permission_set_ids`: flat list of all mandatory permission set IDs
          plus any optional IDs the user toggled on (FR-011, FR-014).

        The endpoint uses upsert semantics — one grant per (principal, agent) pair.
        Mandatory permission sets must always be included; omitting them is a 422 error.

        **Previous field `delegated_oauth2_tokens` is removed.** Clients must use
        `granted_permission_set_ids` exclusively.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantRequest'
            example:
              granted_permission_set_ids:
                - "ps-uuid-1"
                - "ps-uuid-2"
              valid_until: null
      responses:
        '201':
          description: Grant created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantResponse'
              example:
                id: "grant-uuid"
                agent_id: "agent-uuid"
                principal: "user@example.com"
                granted_permission_set_ids:
                  - "ps-uuid-1"
                  - "ps-uuid-2"
                valid_until: null
                created_at: "2026-03-25T12:00:00Z"
                updated_at: "2026-03-25T12:00:00Z"
        '422':
          description: |
            Validation error:
            - Empty `granted_permission_set_ids` list
            - Missing mandatory permission set IDs
            - Unknown permission set IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /oauth2/token:
    post:
      tags: [OAuth2]
      summary: Token exchange (extended)
      operationId: tokenExchange
      description: |
        RFC 8693 token exchange endpoint.

        **Permission Sets change (019)**:
        The response now includes `granted_permission_set_ids: UUID[]` alongside the
        access token. This field contains the same IDs stored in the `UserGrant` (FR-012).

        Raw OAuth2 scopes are NOT included in this field (SR-003).

        **Token exchange validation (FR-017, FR-018)**:
        - Resolves `granted_permission_set_ids` → effective scopes per service (cache TTL ≤ 60s)
        - Validates that existing `UserSession` tokens already cover the required scopes
        - If scopes are insufficient, returns an error — scopes are NOT expanded or re-requested

        **Cache staleness**: Permission set definitions are cached for ≈60s. Scope changes
        to a permission set take effect within 60s on the token exchange path.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [urn:ietf:params:oauth:grant-type:token-exchange]
                subject_token:
                  type: string
                subject_token_type:
                  type: string
                audience:
                  type: string
      responses:
        '200':
          description: Token exchange successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: "eyJhbGci..."
                token_type: "bearer"
                expires_in: 3600
                granted_permission_set_ids:
                  - "ps-uuid-1"
                  - "ps-uuid-2"
        '400':
          description: Invalid request or insufficient token scope (FR-018)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
              example:
                error: "invalid_request"
                error_description: "UserSession token for service 'github' does not cover required scopes: [repo:read]. Re-authorize to acquire missing scopes."

components:
  schemas:
    ServiceScopeInfo:
      type: object
      required:
        - service_id
        - requirement_type
      properties:
        service_id:
          type: string
          format: uuid
        requirement_type:
          type: string
          enum:
            - mandatory
            - optional
          description: Whether this service is mandatory or optional within the permission set. Raw scopes are intentionally omitted (FR-007).

    PermissionSetInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        service_scopes:
          type: array
          items:
            $ref: '#/components/schemas/ServiceScopeInfo'

    ResolvedPermissionSetEntry:
      type: object
      properties:
        permission_set:
          $ref: '#/components/schemas/PermissionSetInfo'
        requirement_type:
          type: string
          enum: [mandatory, optional]
          description: |
            - `mandatory`: card is pre-selected and locked (user cannot deselect)
            - `optional`: card is pre-unselected and togglable (user can select/deselect)

    ServiceRequirementInfo:
      type: object
      properties:
        service_id:
          type: string
          format: uuid
        requirement_type:
          type: string
          enum: [mandatory, optional]
        required_scopes:
          type: array
          items:
            type: string

    AgentInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
        display_name:
          type: string
        description:
          type: string
        service_requirements:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRequirementInfo'

    AvailableServiceInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string

    AgentConsentInfoResponse:
      type: object
      required: [agent, permission_sets, active_session_service_ids, available_services]
      properties:
        agent:
          $ref: '#/components/schemas/AgentInfo'
        permission_sets:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedPermissionSetEntry'
          description: |
            Resolved permission sets in agent-declaration order. Used to render
            the "Agent Permissions" section above service connections (FR-007, FR-008).
        active_session_service_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Service IDs for which the principal already has an active OAuth2 session.
            Services in this list should NOT show a connect button (FR-009, FR-010).
        available_services:
          type: array
          items:
            $ref: '#/components/schemas/AvailableServiceInfo'
          description: All third-party services known to the system (for display purposes)

    CreateGrantRequest:
      type: object
      required: [granted_permission_set_ids]
      properties:
        granted_permission_set_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: |
            Flat list of permission set IDs being granted. MUST include all mandatory
            permission set IDs for the agent. MAY be empty for optional sets only if
            zero optional sets are selected. Mandatory sets are always required.
        valid_until:
          type: string
          format: date-time
          nullable: true
          description: Grant expiry (null = indefinite)

    GrantResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        principal:
          type: string
        granted_permission_set_ids:
          type: array
          items:
            type: string
            format: uuid
        valid_until:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, granted_permission_set_ids]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Token lifetime in seconds
        granted_permission_set_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Permission set IDs from the underlying grant. Does NOT include raw OAuth2 scopes
            (SR-003). Empty array if the grant has no permission sets.

    ErrorResponse:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    OAuth2ErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string

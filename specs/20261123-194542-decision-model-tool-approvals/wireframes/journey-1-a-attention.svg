<svg xmlns="http://www.w3.org/2000/svg" width="892.8" height="976.8571428571429" viewBox="0 0 892.8 976.8571428571429" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14" id="wireframes/journey-1-a-attention.svg"><rect x="0" y="0" width="892.8" height="976.8571428571429" fill="#ffffff" /><rect x="0.5" y="0.5" width="544.6" height="875.8571428571429" fill="none" stroke="#505050" stroke-width="1.25" /><line x1="0" y1="36" x2="545.6" y2="36" stroke="#b0b0b0" stroke-width="1" /><text x="272.8" y="23.333333333333332" text-anchor="middle" font-size="16" font-weight="600" fill="#2d2d2d">Tool Approval Request</text><line x1="0" y1="76" x2="545.6" y2="76" stroke="#b0b0b0" stroke-width="1" /><text x="120.80000000000001" y="61" font-weight="700" fill="#2d2d2d">Agentic Identity Broker</text><text x="302.4" y="61" fill="#7a7f87">alice@example.com</text><rect x="16.5" y="92.5" width="512.6" height="76.71428571428572" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3" rx="2" /><text x="28" y="123.28571428571428" font-weight="700" font-size="18" fill="#2d2d2d">Tool Approval Request</text><text x="28" y="152.71428571428572" fill="#7a7f87">Review what the agent wants to do, then choose how long to allow it.</text><text x="16" y="195.71428571428572" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6b7078">REQUEST</text><line x1="16" y1="199.71428571428572" x2="529.6" y2="199.71428571428572" stroke="#c4c4c4" stroke-width="1" opacity="0.6" /><text x="16" y="222.71428571428572" fill="#2d2d2d">Requested by</text><text x="529.6" y="222.71428571428572" text-anchor="end" fill="#2d2d2d">Research Assistant</text><text x="16" y="250.71428571428572" fill="#2d2d2d">Risk</text><rect x="53.3" y="236.21428571428572" width="76.6" height="21" rx="11" fill="#eef0f3" stroke="#c4c8ce" stroke-width="1" /><text x="62.8" y="251.38095238095238" font-size="12" fill="#3a3e44">Critical</text><text x="16" y="280.7142857142857" fill="#2d2d2d">Action</text><text x="529.6" y="280.7142857142857" text-anchor="end" fill="#2d2d2d">Share a Drive file</text><text x="16" y="323.7142857142857" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6b7078">AUTOMATED ASSESSMENT</text><line x1="16" y1="327.7142857142857" x2="529.6" y2="327.7142857142857" stroke="#c4c4c4" stroke-width="1" opacity="0.6" /><text x="16" y="350.7142857142857" font-weight="700" fill="#2d2d2d">Automated checks found risk indicators. Review the details.</text><rect x="16.5" y="364.2142857142857" width="83.8" height="21" rx="11" fill="#eef0f3" stroke="#c4c8ce" stroke-width="1" /><text x="26" y="379.3809523809524" font-size="12" fill="#3a3e44">Indicated</text><text x="108.8" y="378.7142857142857" fill="#2d2d2d">Gives access or data to a party outside the organisation</text><rect x="16.5" y="394.2142857142857" width="83.8" height="21" rx="11" fill="#eef0f3" stroke="#c4c8ce" stroke-width="1" /><text x="26" y="409.3809523809524" font-size="12" fill="#3a3e44">Indicated</text><text x="108.8" y="408.7142857142857" fill="#2d2d2d">Changes who can access a resource</text><rect x="16.5" y="424.2142857142857" width="69.4" height="21" rx="11" fill="#eef0f3" stroke="#c4c8ce" stroke-width="1" /><text x="26" y="439.3809523809524" font-size="12" fill="#3a3e44">Unclear</text><text x="94.4" y="438.7142857142857" fill="#2d2d2d">Has an effect that cannot be undone</text><rect x="16.5" y="454.2142857142857" width="112.60000000000001" height="21" rx="11" fill="#eef0f3" stroke="#c4c8ce" stroke-width="1" /><text x="26" y="469.3809523809524" font-size="12" fill="#3a3e44">Not indicated</text><text x="137.60000000000002" y="468.7142857142857" fill="#2d2d2d">Contains text addressed to a reviewer</text><text x="16" y="496.57142857142856" font-size="12" fill="#7a7f87">Automated checks can be wrong. They do not replace your review.</text><text x="16" y="538.8571428571429" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6b7078">TECHNICAL DETAILS</text><line x1="16" y1="542.8571428571429" x2="529.6" y2="542.8571428571429" stroke="#c4c4c4" stroke-width="1" opacity="0.6" /><text x="16" y="565.8571428571429" fill="#2d2d2d">Tool</text><text x="529.6" y="565.8571428571429" text-anchor="end" fill="#2d2d2d">drive.share_file</text><text x="16" y="593.8571428571429" fill="#2d2d2d">file_id</text><text x="529.6" y="593.8571428571429" text-anchor="end" fill="#2d2d2d">1Zx9QpL0aB3</text><text x="16" y="621.8571428571429" fill="#2d2d2d">role</text><text x="529.6" y="621.8571428571429" text-anchor="end" fill="#2d2d2d">editor</text><text x="16" y="649.8571428571429" fill="#2d2d2d">grantee_domain</text><text x="529.6" y="649.8571428571429" text-anchor="end" fill="#2d2d2d">thirdparty.example.com</text><text x="16" y="677.8571428571429" fill="#2d2d2d">transfer_ownership</text><text x="529.6" y="677.8571428571429" text-anchor="end" fill="#2d2d2d">false</text><text x="16" y="720.8571428571429" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6b7078">HOW LONG SHOULD THIS BE ALLOWED?</text><line x1="16" y1="724.8571428571429" x2="529.6" y2="724.8571428571429" stroke="#c4c4c4" stroke-width="1" opacity="0.6" /><g opacity="1"><circle cx="24" cy="742.8571428571429" r="7.5" fill="#ffffff" stroke="#6b7078" stroke-width="1.2" /><circle cx="24" cy="742.8571428571429" r="4" fill="#2d2d2d" /><text x="40" y="747.5238095238095" fill="#2d2d2d">Just this once</text></g><g opacity="1"><circle cx="24" cy="770.8571428571429" r="7.5" fill="#ffffff" stroke="#6b7078" stroke-width="1.2" /><text x="40" y="775.5238095238095" fill="#2d2d2d">For this session</text></g><g opacity="1"><circle cx="24" cy="798.8571428571429" r="7.5" fill="#ffffff" stroke="#6b7078" stroke-width="1.2" /><text x="40" y="803.5238095238095" fill="#2d2d2d">Always</text></g><g opacity="1"><rect x="378.90000000000003" y="829.3571428571429" width="59.8" height="31" fill="#ffffff" stroke="#505050" stroke-width="1.25" rx="3" /><text x="408.8" y="849.5238095238095" text-anchor="middle" font-weight="500" fill="#2d2d2d">Deny</text></g><g opacity="1"><rect x="447.70000000000005" y="829.3571428571429" width="81.4" height="31" fill="#3a3a3a" stroke="#505050" stroke-width="1.25" rx="3" /><text x="488.40000000000003" y="849.5238095238095" text-anchor="middle" font-weight="500" fill="#ffffff">Approve</text></g><line x1="130.39999999999998" y1="246.71428571428572" x2="593.6" y2="246.71428571428572" stroke="#8a7a4f" stroke-width="1" /><circle cx="130.39999999999998" cy="246.71428571428572" r="3" fill="#8a7a4f" /><rect x="593.6" y="228.71428571428572" width="283.2" height="36" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="605.6" y="250.71428571428572" fill="#3d3526">Derived by the policy from this call</text><line x1="529.6" y1="409.28571428571433" x2="593.6" y2="409.28571428571433" stroke="#8a7a4f" stroke-width="1" /><circle cx="529.6" cy="409.28571428571433" r="3" fill="#8a7a4f" /><rect x="593.6" y="381.28571428571433" width="225.6" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="605.6" y="403.28571428571433" fill="#3d3526">Operator-written statements.</text><text x="605.6" y="423.28571428571433" fill="#3d3526">No model text, no numbers.</text><line x1="408.8" y1="860.8571428571429" x2="408.8" y2="924.8571428571429" stroke="#8a7a4f" stroke-width="1" /><circle cx="408.8" cy="860.8571428571429" r="3" fill="#8a7a4f" /><rect x="321.2" y="924.8571428571429" width="175.20000000000002" height="36" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="333.2" y="946.8571428571429" fill="#3d3526">Step 10: Alice clicks</text></svg>

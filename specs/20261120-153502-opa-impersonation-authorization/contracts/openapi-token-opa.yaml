# End-User OpenAPI delta: POST /oauth2/token, OPA impersonation authorization
#
# Feature: specs/20261120-153502-opa-impersonation-authorization
# Sign-off: plan.md Approval Item API-DECISION. Research R9.
#
# No new endpoint, request/response field, status code, OAuth error code, or token claim is added.
# The description documents selectable engines, revision-bound unsigned-agent classification,
# terminal failures, and the preserved unbound-human fallback; it adds one 500 example.

info:
  version: 1.4.0   # from 1.3.0: additive documented behavior on an existing operation

paths:
  /oauth2/token:
    post:
      description_changes:
        - section: "Token Exchange Grant (RFC 8693) — User Impersonation (local mode only)"
          replace: >-
            "Signed credentials are validated for signature, issuer, audience, expiry, and not-before
            before a CEL authorization predicate decides the request."
          with: >-
            Signed credentials are validated for signature, issuer, audience, expiry, and not-before
            before the rule's authorization decides the request. Each rule selects exactly one engine:
            a CEL predicate or an operator-managed Open Policy Agent (OPA) policy. Selecting OPA never
            replaces credential validation, subject-category eligibility, cross-agent rejection, user
            delegation, scope checks, or local minting.
        - section: "Token Exchange Grant (RFC 8693) — User Impersonation (local mode only)"
          append_subsection: |
            #### Policy decisions
            A rule's policy either allows the request or explicitly denies it. An explicit denial
            makes the rule not match, and later rules are evaluated in order; if none matches, the
            response is `403 access_denied` (`impersonation not permitted`) without `error_uri`.
            A policy that cannot produce a valid allow or deny decision, an evaluation error, or a
            timeout returns `500 server_error` (`authorization evaluation failed`) and stops rule
            evaluation; later rules are not tried and no token is issued. Policy-produced text is
            never returned. Request headers, including identity-looking headers, never replace the
            validated client, actor, or subject credentials that a policy evaluates. Caller cancellation
            stops authorization without issuance or later-rule fallback; the internal error mapping
            remains `server_error`, but a disconnected client has no HTTP response guarantee. Policy updates
            apply to subsequent requests only; issued tokens are not revoked.
        - section: "Agent subjects"
          source: api/enduser/openapi.yaml:1592-1599
          replace: >-
            Each impersonation rule lists accepted `allowed_subject_categories`: `human`, `agent`,
            or both. Omission means `[human]`. No request parameter selects the category. A request
            is agent-category only when the rule's subject role is signed, its credential verifies,
            and its raw string `sub` is byte-for-byte equal to the canonical UUID of the target
            selected by `audience`. Every other request is human-category, including every unsigned
            (`verification: none`) subject. Aliases, display names, other agents' UUIDs and different
            UUID spelling do not qualify. All configured principal extractions must still succeed;
            an eligible agent's represented subject is the target UUID, not necessarily the extracted principal.
          with: >-
            Each impersonation rule lists accepted `allowed_subject_categories`: `human`, `agent`,
            or both. Omission means `[human]`. No request parameter selects the category. A raw
            string `sub` byte-for-byte equal to the audience-selected canonical target UUID is
            agent-category when signed and verified; when explicitly unverified, it is agent-category
            on an OPA-authorized rule, and on a CEL-authorized rule only when the predicate binds
            `subject_token.sub`. Without that CEL binding an unsigned exact-target subject remains
            human and requires human eligibility and delegation. For an unverified subject on an OPA
            rule, the policy is the only control on which agents a client may represent, so it must
            constrain `input.context.subject_token.sub`. Another registered
            agent's UUID or extracted identity is a rejected cross-agent request, with no human
            fallback or consent link. Aliases, display names and different UUID spelling do not
            qualify. Principal extraction must still succeed; the eligible agent's represented subject
            is the target UUID, not necessarily the extracted principal.
        - section: "Agent subjects"
          replace: "Signed exact equality on human-only or omitted-category rules"
          with: "Agent-category exact equality on human-only or omitted-category rules"
        - section: "Agent subjects"
          replace: "Eligible, CEL-authorized agents"
          with: "Eligible, rule-authorized agents"
      responses:
        "500":
          content:
            application/json:
              examples:
                impersonation_authorization_failed:
                  summary: Impersonation - rule authorization could not be evaluated
                  value:
                    error: "server_error"
                    error_description: "authorization evaluation failed"

docs:
  - docs/api/enduser-api.md: mirror policy decisions, the 500 example, and the full replacement Agent subjects paragraph with revision-bound unsigned classification and unbound-human fallback.
  - docs/reference/token-exchange.md: add the two diagnostic details (contracts/observability.md).

# Configuration contract: OPA authorization for impersonation rules
#
# Feature: specs/20261120-153502-opa-impersonation-authorization
# Sign-off: plan.md Approval Items API-CFG (keys, defaults, validation) and API-BOOT (bootstrap subset).
# Research: R3, R7, R10, R11, R15, R16.
#
# One OPA engine is shared by every OPA rule (R11, "option B" of the 2026-11-24 revision). Engine
# settings live once under oauth2_authorization_server.impersonation.opa. Each rule that selects OPA
# names only its decision. Rules are a YAML list, so per-rule keys have no environment-variable or
# CLI-flag form, like every other per-rule impersonation key. impersonation.opa follows the same
# rule: it is configured in the file only. Ordinary-exchange CEL remains unchanged; explicit
# token_exchange.authorization.type opa fails startup (Proposed: API-CFG).

file_containment:            # R3 (revised 2026-11-24): applies to every file the broker reads for OPA
  rules:
    - every configured path is absolute; no security.trust_material_dir or other directory setting is used
    - config_file and the token file are opened through an os.Root over the file's own parent directory;
      a local bundle is walked through an os.Root over the bundle directory itself
    - that directory must not resolve to /
    - a symlink is followed only when it stays inside that directory; absolute symlinks are rejected
      by os.Root, while relative Kubernetes Secret and ConfigMap links (..data) work
    - regular-file checks and bounded reads use the same descriptor
    - escaping symlinks, non-regular, oversized, or unreadable files fail without echoing content
  purpose: >-
    The admin who writes a path can choose any path, so containment is not a boundary against the
    admin. It confines content written by others: a rotated token file cannot become a link to
    another credential, and a bundle file cannot pull outside files into policy data.

engine:                      # oauth2_authorization_server.impersonation.opa
  presence:
    - required when at least one rule has authorization.type opa
    - MUST be absent or empty when no rule selects opa; startup fails, so a CEL-only deployment
      never opens a bundle connection
  properties:
    policy.config_file:
      type: string
      default: none
      description: >-
        Managed mode. Path of the OPA bootstrap configuration file (YAML or JSON), read once at
        startup. Only the accepted subset below is allowed. Changing the file requires a restart;
        bundle contents update without restart.
      validation:
        - exactly one of policy.config_file and policy.path is set
        - file_containment rules; regular file, at most 1 MiB
        - no unrestricted file-opening fallback
    policy.path:
      type: string
      default: none
      description: >-
        Local mode (R15). Absolute path of a bundle directory (OPA bundle layout: .rego modules,
        data.json or data.yaml files, optional .manifest), read once at startup through an os.Root
        over that directory and admitted like a managed revision. There is no polling:
        changing the directory takes effect only after a restart. Intended for development,
        tests, and deployments that ship policy with the release.
      validation:
        - exactly one of policy.config_file and policy.path is set
        - file_containment rules, with the bundle directory as the root
        - regular files and directories only; symlinks must stay inside the bundle directory
        - files other than *.rego, data.json, data.yaml, data.yml, and .manifest fail startup naming the relative path
        - at most 16 MiB in total and 1,000 files; exceeding either fails startup
        - a .manifest is optional; its revision becomes the policy_revision label, otherwise the label is "local="
    startup_timeout:
      type: duration
      default: 30s
      range: [1s, 5m]
      description: >-
        Bound for the shared engine to become ready: SDK readiness (managed mode) and one admitted
        revision whose own committing snapshot contains every configured bundle and satisfies every
        OPA rule's admission. A historical bundle activation plus an earlier subset candidate cannot
        satisfy readiness. Otherwise startup fails.

rule:                        # oauth2_authorization_server.impersonation.rules[<i>]
  authorization.type:
    type: string
    enum: [cel, opa]
    required: true
    default: none            # existing behavior: no implicit engine
    validation:
      - unknown value fails startup: "rules[<i>].authorization.type"
  authorization.cel:
    description: Existing CEL block, unchanged. Required when type is cel; MUST be absent or empty when type is opa.
  authorization.opa:
    description: >-
      The rule's decision in the shared engine. Optional when type is opa (all members have
      defaults); MUST be absent or empty when type is cel.
    properties:
      package:
        type: string
        default: aib.broker.impersonation
        description: Rego package of the decision, dot-separated, without the "data." prefix (e.g. company.impersonation).
        validation:
          - each segment is a Rego identifier ([A-Za-z_][A-Za-z0-9_]*); otherwise startup fails
      decision:
        type: string
        default: result
        description: Rule name in package whose value is the decision document. Same default as ExtProc.
        validation:
          - a single Rego identifier; otherwise startup fails
      evaluation_timeout:
        type: duration
        default: 100ms
        range: [10ms, 5s]
        description: Per-request decision deadline. Timeout and cancellation are terminal 500 server_error.
    rejected_keys:
      description: >-
        Every other key fails startup naming it, including the former reserved policy_url and
        policy_path declarations and the engine settings policy, policy.config_file, policy.path,
        and startup_timeout, which belong under impersonation.opa (issue 2 of the 2026-11-24 review).
  sharing:
    - several rules may name the same package and decision; each rule keeps its own binding requirements
    - a request reads one revision before the first rule and uses it for every OPA rule it evaluates (R11)

bootstrap_subset:            # API-BOOT, managed mode only
  accepted_top_level_keys: [services, bundles, keys, labels, plugins]
  plugins:
    accepted: [aib_bearer_token_file]
    aib_bearer_token_file:   # R16
      description: >-
        Broker-registered OPA credential plugin (rest.HTTPAuthPlugin). A service selects it with
        credentials.plugin: aib_bearer_token_file. Before every bundle request it reads the token
        through an os.Root over the token file's directory, so a rotated Secret takes effect
        without a restart and the file cannot be swapped for a link outside that directory.
      properties:
        path: {type: string, required: true, rules: absolute, file_containment rules, regular file, at most 64 KiB, surrounding whitespace trimmed, non-empty}
        scheme: {type: string, default: Bearer}
      validation:
        - path is checked at startup; an unreadable or invalid token at startup fails startup naming plugins.aib_bearer_token_file.path
        - a later read failure fails that bundle request; OPA retries and the last admitted revision stays
        - one token file per bootstrap; services needing different tokens use inline credentials
  rejected_examples: [decision_logs, status, discovery, server, persistence_directory, caching,
                      distributed_tracing, nd_builtin_cache, storage, default_decision, default_authorization_decision,
                      "plugins.<any other name>"]
  rules:
    - every top-level key outside the accepted list fails startup; the diagnostic names the key, never its value
    - bundles must contain at least one entry
    - bundles.<name>.persist true fails startup
    - service credentials are inline (bearer token, oauth2 client credentials) or credentials.plugin aib_bearer_token_file
    - reject every OPA-native local file read, including bearer token_path, TLS file paths, client_tls, and file:// bundles
    - validate nested settings against the pinned OPA types before sdk.New; unchecked local-file references are forbidden
    - OPA parser errors are not echoed; the diagnostic gives the field and a reason class
  reuse_from_extproc: >-
    An ExtProc bootstrap file is accepted only if it uses the subset above. Files with
    decision_logs, status, discovery, or other plugins fail startup by design; copy only services,
    bundles, keys, and labels.
  diagnostic_reason_classes: [unreadable, invalid_document, unsupported_key, no_bundles, persist_unsupported,
                              invalid_opa_configuration, path_not_absolute, root_directory, escaping_link,
                              file_too_large, local_file_unsupported, too_many_files, unsupported_file,
                              token_invalid]

startup_diagnostics:         # credential-free
  engine_prefix: "oauth2_authorization_server.impersonation.opa: "
  rule_prefix: "oauth2_authorization_server.impersonation.rules[<i>] (<name>): "
  messages:
    - engine policy: "exactly one of policy.config_file and policy.path is required"
    - engine: "required when a rule selects authorization.type \"opa\""
    - engine: "must be empty when no rule selects authorization.type \"opa\""
    - engine policy.config_file: "<reason class> [key <name>]"
    - engine policy.path: "<reason class> [file <relative path>]"
    - engine plugins.aib_bearer_token_file.path: "<reason class>"
    - engine startup_timeout: "no admissible policy revision within <duration> (last rejection: <reason> for rules[<i>] (<name>))"
    - rule authorization.type: "must be \"cel\" or \"opa\""
    - rule authorization.cel: "must be empty when authorization.type is \"opa\""
    - rule authorization.opa: "must be empty when authorization.type is \"cel\""
    - rule authorization.opa.<key>: "unsupported key; engine settings belong under impersonation.opa"

ordinary_exchange:           # Proposed API-CFG compatibility correction; FR-009
  token_exchange.authorization.type:
    rejected: opa
    diagnostic: 'token_exchange.authorization.type: OPA is supported only on impersonation rules'
    enforcement: loader validation and domain service construction, including loader-bypassing builders
    unchanged: valid CEL settings and defaults; reserved OPA fields remain declarations, not an implemented engine

example:
  oauth2_authorization_server:
    mode: local
    impersonation:
      audience_prefix: https://broker.example.com/impersonate
      opa:
        policy:
          config_file: /etc/broker/opa/bootstrap.yaml
        startup_timeout: 30s
      rules:
        - name: governed-inventory
          allowed_subject_categories: [human]
          roles:
            client_assertion: {expected_audience: https://broker.example.com/oauth2/token, principal_expression: client_assertion.sub}
            actor: {expected_audience: broker-impersonation, principal_expression: actor_token.sub}
            subject: {expected_audience: broker-impersonation, principal_expression: subject_token.sub}
          trusted_issuers:
            - issuer_uri: https://identity.example.com
              jwks_uri: https://identity.example.com/jwks.json
              allowed_algorithms: [RS256]
              signs_roles: [client_assertion, actor, subject]
          authorization:
            type: opa
            opa:
              package: company.impersonation
              decision: result
              evaluation_timeout: 100ms

example_bootstrap:
  services:
    governance:
      url: https://policies.example.com
      credentials:
        plugin: aib_bearer_token_file
  plugins:
    aib_bearer_token_file:
      path: /var/run/secrets/opa-bundle/token
  bundles:
    impersonation:
      service: governance
      resource: bundles/impersonation.tar.gz
      polling: {min_delay_seconds: 30, max_delay_seconds: 60}
  keys:
    governance-signing:
      algorithm: RS256
      key: "<PEM public key>"

example_local:               # development and tests
  oauth2_authorization_server:
    impersonation:
      opa:
        policy:
          path: /opt/broker/policy/impersonation-bundle

helm:                        # charts/agentic-identity-broker
  values: >-
    broker.oauth2AuthorizationServer.impersonation stays a verbatim snake_case block, now including
    its opa engine block. The bootstrap file, a local bundle directory, and a bundle token file are
    mounted wherever suits each (for example a ConfigMap, an image path, and a Secret) with
    existing broker extraVolumes and extraVolumeMounts; they share no mount with the trust
    directory of ADR 040-trust-anchor-local-key-sets, and no new chart value is added. A token file mounted from a Secret rotates
    without a restart; inline bootstrap credentials need a restart.
  values_schema_json: >-
    impersonation gains opa {policy: oneOf {config_file (minLength 1)} or {path (minLength 1)},
    startup_timeout}, additionalProperties false. Rule authorization becomes oneOf
    {type: cel, cel: {...existing}} or {type: opa, opa: {package, decision, evaluation_timeout}},
    both with additionalProperties false.
  readme: document the engine block, the rule block, local mode, and the volume-mount pattern.

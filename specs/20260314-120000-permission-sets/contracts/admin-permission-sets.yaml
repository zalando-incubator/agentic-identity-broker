  #       permission_set_id:
  #         type: string
  #         format: uuid
  #       requirement_type:
  #         type: string
  #         enum: [mandatory, optional]
  #   minItems: 1
  #   description: |
  #     Ordered list of permission set entries for this agent. Must contain at least one
  #     entry (422 if empty). All permission_set_id values must reference existing permission
  #     sets (422 if invalid). Declaration order is preserved.
  #
  # Validation errors for agents (422):
  # - Empty permission_sets list
  # - Non-existent permission_set_id in the list

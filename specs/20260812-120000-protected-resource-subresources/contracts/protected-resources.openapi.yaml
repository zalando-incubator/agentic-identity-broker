# Protected Resource Subresources — API contract (Phase 1)
#
# Feature: 20260812-120000-protected-resource-subresources
# This fragment is authored FIRST (Constitution IV/X: OpenAPI before implementation) and is the
# stakeholder-confirmation artifact for the admin API changes. On acceptance it is merged into
# api/admin/openapi.yaml (canonical base path /api/services — internal/adapters/http/routing/admin.go).
#
# It defines:
#   1. A protected-resources sub-collection under an existing service, where each protected resource is an
#      individually addressable sub-resource keyed by its normalized URI (spec Clarifications §Session
#      2026-08-13):
#        - GET    …/protected-resources             — list the set
#        - POST   …/protected-resources             — add from a request body
#        - PUT    …/protected-resources/{resource}  — idempotent add (resource URI in the path)
#        - PATCH  …/protected-resources/{resource}  — rename (source URI in the path, target in the body)
#        - DELETE …/protected-resources/{resource}  — remove
#      No query parameters. {resource} is the normalized URI fully RFC 3986 percent-encoded as a
#      SINGLE path segment (`:`→`%3A`, `/`→`%2F`, `?`→`%3F`, `#`→`%23`); for PATCH it identifies the source URI. The handler percent-decodes it and
#      runs the existing normalize/validate before matching (FR-005/FR-006 parity). The handler MUST
#      preserve the escaped segment through routing and decode it exactly once; handler and E2E tests cover
#      encoded slashes, query delimiters, fragments, and percent signs on the supported Go 1.25.6 runtime.
#   2. A behavioral change to the existing PUT /api/services/{service-id}:
#        - protected_resources becomes OPTIONAL (nullable/omittable);
#        - when present it authoritatively REPLACES the set and REQUIRES If-Match;
#        - when omitted the set is left unchanged.
#
# A resource's identity is its normalized URI (no opaque id). Normalization = trailing-slash trim on the
# path, query/fragment preserved (urivalidation.NormalizeResourceURI).

openapi: 3.0.3
info:
  title: Third-Party Service Protected Resources (delta)
  version: 1.0.0
  description: >
    Manage a third-party OAuth2 service's protected resource set as first-class, individually addressable
    sub-resources (keyed by percent-encoded normalized URI), plus the optimistic-concurrency change to the
    full-service update. Authentication/authorization are identical to the existing admin
    service-management endpoints (FR-014).

paths:
  /api/services/{service-id}/protected-resources:
    parameters:
      - $ref: '#/components/parameters/ServiceId'

    get:
      summary: List a service's protected resources (US4)
      operationId: listProtectedResources
      tags: [Services]
      responses:
        '200':
          description: The service's normalized protected resource URIs.
          headers:
            ETag:
              description: Service optimistic-concurrency token (version). Use as `If-Match` on replacement PUTs.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceSet' }
        '404': { $ref: '#/components/responses/ServiceNotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    post:
      summary: Add one protected resource from the collection (US1)
      description: >
        Adds the body `resource_uri` after server-side validation and normalization. This is an alternate
        collection-oriented add operation; PUT by percent-encoded member URI remains the canonical
        idempotent member operation. A newly added URI returns 201. A URI already owned by this service
        returns 200 with the set unchanged (FR-008); a URI owned by another service is a conflict (FR-007).
      operationId: createProtectedResource
      tags: [Services]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtectedResourceCreateRequest' }
            examples:
              add:
                value: { resource_uri: "https://api.example.com/v2" }
      responses:
        '201':
          description: Resource added.
          headers:
            ETag: { schema: { type: string }, description: New service version. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceMutationResult' }
        '200':
          description: The service already owned the normalized URI; set unchanged.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceMutationResult' }
        '400':
          description: Missing request body or malformed/relative/empty/whitespace `resource_uri`; rejected before any state change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/ServiceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/services/{service-id}/protected-resources/{resource}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/ResourcePathSegment'

    put:
      summary: Add one protected resource (US1)
      description: >
        Idempotent add. The resource URI is the final path segment, fully percent-encoded and decoded +
        normalized server-side; there is no request body. Adding a URI (or one that normalizes to a URI)
        the service already owns succeeds with the set unchanged (FR-008). Adding a URI owned by another
        service is a conflict (FR-007).
      operationId: addProtectedResource
      tags: [Services]
      responses:
        '201':
          description: Resource added.
          headers:
            ETag: { schema: { type: string }, description: New service version. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceMutationResult' }
        '200':
          description: Idempotent — the service already owned the (normalized) URI; set unchanged.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceMutationResult' }
        '400': { $ref: '#/components/responses/InvalidResourceUri' }
        '404': { $ref: '#/components/responses/ServiceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    patch:
      summary: Rename a protected resource in place (US3)
      description: >
        Changes the resource identified by the path segment (`{resource}`, the percent-encoded source URI)
        to the target URI in the body, atomically (no delete-then-add round trip). `resource == to` succeeds
        as a no-op. A `to` already owned by any service (including this one) is a conflict (FR-007). A
        `{resource}` not present on the service is not-found (FR-009).
      operationId: renameProtectedResource
      tags: [Services]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtectedResourceRenameTarget' }
            examples:
              rename:
                value: { to: "https://api.example.com/v2" }
      responses:
        '200':
          description: Resource renamed (or no-op when source == to).
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceMutationResult' }
        '400': { $ref: '#/components/responses/InvalidResourceUri' }
        '404':
          description: Service not found, or `{resource}` is not a resource of this service (FR-009/FR-010).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    delete:
      summary: Remove one protected resource (US2)
      description: >
        Removes the resource identified by the path segment (`{resource}`, the percent-encoded URI, decoded
        and normalized server-side before matching). Removing a URI the service does not own is not-found
        (FR-009). Immediately stops new token-exchange resolution for that URI (FR-013).
      operationId: removeProtectedResource
      tags: [Services]
      responses:
        '200':
          description: Resource removed. Returns the removed normalized URI and the resulting set (FR-016).
          headers:
            ETag:
              description: New strong service ETag.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceMutationResult' }
        '400': { $ref: '#/components/responses/InvalidResourceUri' }
        '404':
          description: Service not found, or the URI is not a resource of this service (FR-009/FR-010).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ---- Behavioral delta on the existing endpoint (documented here; merged into the canonical path) ----
  /api/services/{service-id}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    put:
      summary: Update a service (protected_resources now optional + optimistic concurrency)
      operationId: updateService
      tags: [Services]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >
            REQUIRED when the request body includes `protected_resources` (authoritative set replacement).
            Value is the service ETag/version from a prior GET. Omitted while replacing → 428; stale → 412.
            Not needed when `protected_resources` is omitted.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            # Same schema as today EXCEPT protected_resources is nullable/omittable with replace semantics.
            schema: { $ref: '#/components/schemas/ServiceUpdateRequest' }
      responses:
        '200':
          description: Service updated.
          headers:
            ETag: { schema: { type: string } }
        '400': { $ref: '#/components/responses/InvalidResourceUri' }
        '404': { $ref: '#/components/responses/ServiceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '412':
          description: If-Match did not match current version — the resource set changed; re-GET and retry.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '428':
          description: protected_resources present but If-Match header missing (replacement requires it).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  parameters:
    ServiceId:
      name: service-id
      in: path
      required: true
      schema: { type: string, format: uuid }

    ResourcePathSegment:
      name: resource
      in: path
      required: true
      description: >
        The target protected resource's normalized URI, fully RFC 3986 percent-encoded as a SINGLE path
        segment (`:`→`%3A`, `/`→`%2F`, `?`→`%3F`, `#`→`%23`). Decoded (`url.PathUnescape`) and normalized
        (trailing-slash trim) server-side before matching. A segment that does not decode to a well-formed
        absolute URI (scheme + host) is rejected with 400. Note: an upstream proxy/gateway that rejects or
        rewrites encoded slashes must be configured to pass `%2F` through (deployment consideration).
      schema: { type: string }
      example: "https%3A%2F%2Fapi.example.com%2Fv2"

  schemas:
    ProtectedResourceSet:
      type: object
      required: [protected_resources]
      properties:
        protected_resources:
          type: array
          items: { type: string, format: uri }
          example: ["https://api.github.com", "https://github.com/api/v3"]

    ProtectedResourceCreateRequest:
      type: object
      required: [resource_uri]
      properties:
        resource_uri:
          type: string
          format: uri
          description: Absolute resource URI (scheme + host). Normalized (trailing-slash trim) server-side.
          example: "https://api.example.com/v2"

    ProtectedResourceRenameTarget:
      type: object
      required: [to]
      properties:
        to:
          type: string
          format: uri
          description: Absolute target URI (scheme + host). Normalized (trailing-slash trim) server-side.
          example: "https://api.example.com/v2"

    ProtectedResourceMutationResult:
      description: Enough resulting state to confirm the outcome without a full-service fetch (FR-016).
      type: object
      required: [resource, protected_resources]
      properties:
        resource:
          type: string
          format: uri
          description: The normalized URI affected by the operation.
        protected_resources:
          type: array
          items: { type: string, format: uri }
          description: The service's resulting resource set.

    ServiceUpdateRequest:
      description: >
        Existing service update body. Only the protected_resources field changes semantics; all other
        fields are as documented on the canonical Service schema.
      type: object
      properties:
        protected_resources:
          type: array
          nullable: true
          description: >
            OPTIONAL. Omit/null → leave the current set unchanged. Present (incl. []) → authoritatively
            REPLACE the set; requires If-Match. Empty array clears the set.
          items: { type: string, format: uri }
      additionalProperties: true

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }

  responses:
    ServiceNotFound:
      description: No service with the given id (FR-010).
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    InvalidResourceUri:
      description: Malformed/relative/empty/whitespace URI — rejected before any state change (FR-006).
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    ResourceConflict:
      description: URI already owned by another service, or rename target already present (FR-007).
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }

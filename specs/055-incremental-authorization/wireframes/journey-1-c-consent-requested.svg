<svg xmlns="http://www.w3.org/2000/svg" width="1467.4285714285716" height="1236.5714285714284" viewBox="0 0 1467.4285714285716 1236.5714285714284" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" font-size="14" id="wireframes/journey-1-c-consent-requested.svg"><rect x="0" y="0" width="1467.4285714285716" height="1236.5714285714284" fill="#ffffff" /><rect x="0.5" y="0.5" width="975.2285714285715" height="1235.5714285714284" fill="none" stroke="#505050" stroke-width="1.25" /><line x1="0" y1="36" x2="976.2285714285715" y2="36" stroke="#b0b0b0" stroke-width="1" /><text x="488.11428571428576" y="23.333333333333332" text-anchor="middle" font-size="16" font-weight="600" fill="#2d2d2d">Consent Management</text><line x1="0" y1="76" x2="976.2285714285715" y2="76" stroke="#b0b0b0" stroke-width="1" /><text x="260.11428571428576" y="61" font-weight="700" fill="#2d2d2d">Agentic Identity Broker</text><text x="441.7142857142858" y="61" font-weight="700" fill="#2d2d2d">Agent Delegations</text><text x="572.1142857142858" y="61" fill="#7a7f87">Third-Party Sessions</text><text x="16" y="107.66666666666667" font-weight="400" fill="#7a7f87">Delegations</text><text x="101.2" y="107.66666666666667" fill="#8a9099">›</text><text x="115.2" y="107.66666666666667" font-weight="600" fill="#2d2d2d">Data Analysis Assistant</text><rect x="16.5" y="122.5" width="943.2285714285715" height="76.71428571428572" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3" rx="2" /><circle cx="50" cy="156" r="21.5" fill="#e2e5ea" stroke="#b5b8bd" stroke-width="1" /><text x="50" y="162" text-anchor="middle" font-size="18" font-weight="600" fill="#3a3e44">DA</text><text x="80" y="153.28571428571428" font-weight="700" font-size="18" fill="#2d2d2d">Data Analysis Assistant</text><text x="80" y="182.71428571428572" fill="#7a7f87">Analyzes datasets and generates insights</text><text x="16" y="225.71428571428572" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6b7078">END DATE</text><line x1="16" y1="229.71428571428572" x2="960.2285714285715" y2="229.71428571428572" stroke="#c4c4c4" stroke-width="1" opacity="0.6" /><text x="16" y="250.57142857142858" font-size="12" fill="#7a7f87">Today: October 27, 2026</text><g opacity="1"><rect x="16.5" y="265.3571428571429" width="15" height="15" rx="2" fill="#ffffff" stroke="#6b7078" stroke-width="1.2" /><text x="40" y="277.5238095238096" fill="#2d2d2d">Specific end date</text></g><text x="16" y="303.7142857142857" font-size="12" fill="#7a7f87">After saving, the agent can use your permissions until revoked</text><text x="16" y="346.00000000000006" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6b7078">AGENT PERMISSIONS</text><line x1="16" y1="350.00000000000006" x2="960.2285714285715" y2="350.00000000000006" stroke="#c4c4c4" stroke-width="1" opacity="0.6" /><text x="16" y="370.8571428571429" font-size="12" fill="#2d2d2d">Review the permissions this agent is requesting. Required permissions are always granted. Toggle optional permissions on or off based on your preference.</text><rect x="16.5" y="383.6428571428572" width="943.2285714285715" height="91.28571428571433" fill="#fafbfc" stroke="#c79a2e" stroke-width="1" rx="4" /><text x="26" y="408.5428571428572" font-weight="600" fill="#2d2d2d">Action required</text><text x="26" y="436.00000000000006" font-weight="700" font-size="12" fill="#2d2d2d">Data Analysis Assistant needs GitHub Production for the action it is performing.</text><text x="26" y="461.1428571428572" font-size="12" fill="#2d2d2d">Keep or select at least one permission set that covers it: GitHub Read Access, GitHub Issue Triage. Then log in to GitHub Production below.</text><rect x="16.5" y="483.92857142857156" width="943.2285714285715" height="151.28571428571422" fill="#fafbfc" stroke="#b5b8bd" stroke-width="1" rx="4" /><text x="26" y="508.82857142857154" font-weight="600" fill="#2d2d2d">Identity Access</text><rect x="26.5" y="523.9285714285716" width="76.6" height="21" rx="11" fill="#eef0f3" stroke="#c4c8ce" stroke-width="1" /><text x="36" y="539.0952380952382" font-size="12" fill="#3a3e44">Required</text><text x="26" y="566.2857142857144" font-size="12" fill="#7a7f87">Sign in as you</text><text x="26" y="591.4285714285716" font-size="12" fill="#7a7f87">SERVICES</text><rect x="26.5" y="604.2142857142858" width="227.8" height="21" rx="11" fill="#eef0f3" stroke="#c4c8ce" stroke-width="1" /><text x="36" y="619.3809523809524" font-size="12" fill="#3a3e44">Corporate Identity · required</text><rect x="16.5" y="644.2142857142858" width="943.2285714285715" height="151.28571428571422" fill="#fafbfc" stroke="#b5b8bd" stroke-width="1" rx="4" /><text x="26" y="669.1142857142858" font-weight="600" fill="#2d2d2d">GitHub Read Access</text><rect x="26.5" y="684.2142857142858" width="76.6" height="21" rx="11" fill="#eef0f3" stroke="#c4c8ce" stroke-width="1" /><text x="36" y="699.3809523809524" font-size="12" fill="#3a3e44">Optional</text><rect x="112.1" y="684.2142857142858" width="191.8" height="21" rx="11" fill="#eef0f3" stroke="#c79a2e" stroke-width="1" /><text x="121.6" y="699.3809523809524" font-size="12" fill="#c79a2e">Covers requested service</text><g opacity="1"><rect x="918.2285714285715" y="684.7142857142858" width="32" height="18" rx="9" fill="#3a3a3a" /><circle cx="941.2285714285715" cy="693.7142857142858" r="7" fill="#ffffff" /><text x="910.2285714285715" y="698.3809523809524" fill="#2d2d2d"></text></g><text x="26" y="726.5714285714287" font-size="12" fill="#7a7f87">Read repository contents and user profile</text><text x="26" y="751.7142857142858" font-size="12" fill="#7a7f87">SERVICES</text><rect x="26.5" y="764.5" width="227.8" height="21" rx="11" fill="#eef0f3" stroke="#c79a2e" stroke-width="1" /><text x="36" y="779.6666666666666" font-size="12" fill="#c79a2e">GitHub Production · requested</text><g opacity="1"><rect x="270.8" y="765" width="32" height="18" rx="9" fill="#3a3a3a" /><circle cx="293.8" cy="774" r="7" fill=
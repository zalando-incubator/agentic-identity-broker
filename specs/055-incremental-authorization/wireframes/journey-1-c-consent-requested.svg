1024.2285714285715" y2="429.2857142857144" stroke="#8a7a4f" stroke-width="1" /><circle cx="960.2285714285715" cy="429.2857142857144" r="3" fill="#8a7a4f" /><rect x="1024.2285714285715" y="401.2857142857144" width="348" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="1036.2285714285715" y="423.2857142857144" fill="#3d3526">New: names the service from the virtual scope</text><text x="1036.2285714285715" y="443.2857142857144" fill="#3d3526">and lists every permission set that covers it</text><line x1="304.4" y1="694.7142857142858" x2="1024.2285714285715" y2="694.7142857142858" stroke="#8a7a4f" stroke-width="1" /><circle cx="304.4" cy="694.7142857142858" r="3" fill="#8a7a4f" /><rect x="1024.2285714285715" y="666.7142857142858" width="348" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="1036.2285714285715" y="688.7142857142858" fill="#3d3526">New marker on each covering set.</text><text x="1036.2285714285715" y="708.7142857142858" fill="#3d3526">Toggles stay editable: the user picks the set</text><line x1="950.2285714285715" y1="854" x2="1024.2285714285715" y2="854" stroke="#8a7a4f" stroke-width="1" /><circle cx="950.2285714285715" cy="854" r="3" fill="#8a7a4f" /><rect x="1024.2285714285715" y="826" width="283.2" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="1036.2285714285715" y="848" fill="#3d3526">Unchanged: a set the user leaves off</text><text x="1036.2285714285715" y="868" fill="#3d3526">stays off</text><line x1="950.2285714285715" y1="1087.4285714285713" x2="1024.2285714285715" y2="1087.4285714285713" stroke="#8a7a4f" stroke-width="1" /><circle cx="950.2285714285715" cy="1087.4285714285713" r="3" fill="#8a7a4f" /><rect x="1024.2285714285715" y="1059.4285714285713" width="355.2" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="1036.2285714285715" y="1081.4285714285713" fill="#3d3526">Unchanged: Login starts the GitHub sign-in</text><text x="1036.2285714285715" y="1101.4285714285713" fill="#3d3526">and returns here (ADR 037 keeps the selection)</text><line x1="960.2285714285714" y1="1204.5714285714284" x2="1024.2285714285715" y2="1204.5714285714284" stroke="#8a7a4f" stroke-width="1" /><circle cx="960.2285714285714" cy="1204.5714285714284" r="3" fill="#8a7a4f" /><rect x="1024.2285714285715" y="1176.5714285714284" width="427.2" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="1036.2285714285715" y="1198.5714285714284" fill="#3d3526">Disabled until a selected set includes GitHub Production</text><text x="1036.2285714285715" y="1218.5714285714284" fill="#3d3526">(new) and it has an active session (FR-020, unchanged)</text></svg>

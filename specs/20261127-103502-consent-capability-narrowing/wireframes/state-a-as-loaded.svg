ected above</text><g opacity="1"><rect x="720.2142857142857" y="457.3571428571429" width="67" height="31" fill="#3a3a3a" stroke="#505050" stroke-width="1.25" rx="3" /><text x="753.7142857142857" y="477.5238095238096" text-anchor="middle" font-weight="500" fill="#ffffff">Login</text></g><g opacity="0.55"><rect x="636.6142857142858" y="519.3571428571429" width="160.6" height="31" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.25" rx="3" /><text x="716.9142857142857" y="539.5238095238095" text-anchor="middle" font-weight="500" fill="#b8b8b8">Approve &amp; Delegate</text></g><line x1="363.2" y1="301.28571428571433" x2="299.2" y2="301.28571428571433" stroke="#8a7a4f" stroke-width="1" /><circle cx="363.2" cy="301.28571428571433" r="3" fill="#8a7a4f" /><rect x="30.399999999999977" y="273.28571428571433" width="268.8" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="42.39999999999998" y="295.28571428571433" fill="#3d3526">One row per permission set.</text><text x="42.39999999999998" y="315.28571428571433" fill="#3d3526">No service or scope is named here.</text><line x1="363.2" y1="457.8571428571429" x2="299.2" y2="457.8571428571429" stroke="#8a7a4f" stroke-width="1" /><circle cx="363.2" cy="457.8571428571429" r="3" fill="#8a7a4f" /><rect x="16" y="429.8571428571429" width="283.2" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="28" y="451.8571428571429" fill="#3d3526">Accounts to connect are derived from</text><text x="28" y="471.8571428571429" fill="#3d3526">the selected capabilities.</text><line x1="797.7142857142858" y1="217.71428571428572" x2="861.7142857142858" y2="217.71428571428572" stroke="#8a7a4f" stroke-width="1" /><circle cx="797.7142857142858" cy="217.71428571428572" r="3" fill="#8a7a4f" /><rect x="861.7142857142858" y="189.71428571428572" width="297.6" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="873.7142857142858" y="211.71428571428572" fill="#3d3526">One switch for the whole grant.</text><text x="873.7142857142858" y="231.71428571428572" fill="#3d3526">Off: the agent gets what it asked for.</text><line x1="787.7142857142857" y1="317.7142857142857" x2="861.7142857142858" y2="317.7142857142857" stroke="#8a7a4f" stroke-width="1" /><circle cx="787.7142857142857" cy="317.7142857142857" r="3" fill="#8a7a4f" /><rect x="861.7142857142858" y="289.7142857142857" width="304.8" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="873.7142857142858" y="311.7142857142857" fill="#3d3526">Preset per set. Full = every capability</text><text x="873.7142857142858" y="331.7142857142857" fill="#3d3526">the agent's entry lists.</text></svg>

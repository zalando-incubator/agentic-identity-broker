t x="797.9428571428571" y="779.5238095238095" text-anchor="middle" font-weight="500" fill="#ffffff">Login</text></g><rect x="378.1" y="809.3571428571429" width="463.3428571428571" height="81" fill="#fafbfc" stroke="#b5b8bd" stroke-width="1" rx="4" /><text x="387.6" y="834.2571428571429" font-weight="600" fill="#2d2d2d">Slack</text><text x="387.6" y="861.7142857142858" font-size="12" fill="#7a7f87">Needed for Slack Notifications</text><g opacity="1"><rect x="764.4428571428571" y="849.3571428571429" width="67" height="31" fill="#3a3a3a" stroke="#505050" stroke-width="1.25" rx="3" /><text x="797.9428571428571" y="869.5238095238095" text-anchor="middle" font-weight="500" fill="#ffffff">Login</text></g><g opacity="0.55"><rect x="680.842857142857" y="911.3571428571429" width="160.6" height="31" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.25" rx="3" /><text x="761.142857142857" y="931.5238095238095" text-anchor="middle" font-weight="500" fill="#b8b8b8">Approve &amp; Delegate</text></g><line x1="473.20000000000005" y1="427.7142857142857" x2="313.6" y2="427.7142857142857" stroke="#8a7a4f" stroke-width="1" /><circle cx="473.20000000000005" cy="427.7142857142857" r="3" fill="#8a7a4f" /><rect x="16" y="389.7142857142857" width="297.6" height="76" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="28" y="411.7142857142857" fill="#3d3526">Set-level include toggle stays.</text><text x="28" y="431.7142857142857" fill="#3d3526">Off withholds the whole set, mandatory</text><text x="28" y="451.7142857142857" fill="#3d3526">capabilities included.</text><line x1="377.6" y1="849.8571428571429" x2="313.6" y2="849.8571428571429" stroke="#8a7a4f" stroke-width="1" /><circle cx="377.6" cy="849.8571428571429" r="3" fill="#8a7a4f" /><rect x="88.00000000000003" y="821.8571428571429" width="225.6" height="56" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="100.00000000000003" y="843.8571428571429" fill="#3d3526">Disappears if Alice switches</text><text x="100.00000000000003" y="863.8571428571429" fill="#3d3526">Slack Notifications off.</text><line x1="841.9428571428571" y1="217.71428571428572" x2="905.9428571428571" y2="217.71428571428572" stroke="#8a7a4f" stroke-width="1" /><circle cx="841.9428571428571" cy="217.71428571428572" r="3" fill="#8a7a4f" /><rect x="905.9428571428571" y="199.71428571428572" width="319.2" height="36" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="917.9428571428571" y="221.71428571428572" fill="#3d3526">Read-only mode is on for the whole grant.</text><line x1="831.9428571428572" y1="542.7142857142858" x2="905.9428571428571" y2="542.7142857142858" stroke="#8a7a4f" stroke-width="1" /><circle cx="831.9428571428572" cy="542.7142857142858" r="3" fill="#8a7a4f" /><rect x="905.9428571428571" y="504.7142857142858" width="333.6" height="76" rx="4" ry="4" fill="#fefcf3" stroke="#b8a26b" stroke-width="1" /><text x="917.9428571428571" y="526.7142857142858" fill="#3d3526">Its only capability is mandatory in the set</text><text x="917.9428571428571" y="546.7142857142858" fill="#3d3526">and writes. Read-only mode leaves it on</text><text x="917.9428571428571" y="566.7142857142858" fill="#3d3526">and says so.</text></svg>

openapi: 3.0.3
info:
  title: Service icon schema additions
  version: 0.1.0
  description: >-
    API fields explicitly approved by the stakeholder in this conversation;
    see service-icons.md for the approval record. Merge these properties into the
    canonical schemas before implementation. Existing API semantics stay unchanged.
paths: {}
components:
  schemas:
    ServiceIconSvg:
      type: string
      nullable: true
      minLength: 1
      description: >-
        Optional SVG document, limited to 65536 UTF-8 bytes after JSON
        decoding and validated against contracts/service-icons.md. This is not a
        URL. Byte size and the SVG security boundary require semantic validation;
        OpenAPI character-length keywords alone cannot enforce them.
        Accepted source is for browser SVG image-mode rendering only, not inline
        SVG or active document embedding. Explicit active constructs are rejected;
        complete static CSS/reference/animation safety is not certified.
      example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>'
    AdminServiceIconWriteProperties:
      type: object
      description: >-
        Add properties to ServiceCreateRequest and ServiceUpdateRequest. Omitted
        on create means absent; omitted on update preserves; null clears.
      properties:
        icon_svg:
          $ref: '#/components/schemas/ServiceIconSvg'
    AdminServiceIconReadProperties:
      type: object
      description: >-
        Add to service create/update/detail/list response objects. Server omits
        the property when absent; non-null values are exact accepted source.
      properties:
        icon_svg:
          $ref: '#/components/schemas/ServiceIconSvg'
    ConsentServiceIconProperties:
      type: object
      description: >-
        Add to ServiceRequirementForUser in data.services, also reused by
        permission-set service rows. Authenticated JSON only. Server omits absent
        values; consumers accept omitted or null. No additional catalog is needed.
      properties:
        iconSvg:
          $ref: '#/components/schemas/ServiceIconSvg'
    SessionServiceIconProperties:
      type: object
      description: >-
        Add to UserSessionSummary, inherited by SessionStatus. Current service
        source rather than a session snapshot. Server omits absent values;
        consumers accept omitted or null.
      properties:
        service_icon_svg:
          $ref: '#/components/schemas/ServiceIconSvg'

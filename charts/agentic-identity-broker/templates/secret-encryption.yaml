{{- if .Values.broker.encryption.memory.rawKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-identity-broker.fullname" . }}-encryption
  labels:
    {{- include "agentic-identity-broker.labels" . | nindent 4 }}
type: Opaque
stringData:
  memory-raw-key: {{ .Values.broker.encryption.memory.rawKey | quote }}
{{- end }}

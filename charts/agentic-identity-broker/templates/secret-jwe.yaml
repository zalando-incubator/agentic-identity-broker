{{- if or .Values.broker.thirdPartyOauth2.jweSigningKey .Values.broker.thirdPartyOauth2.jweSigningKeyBase64 }}
{{- $key := .Values.broker.thirdPartyOauth2.jweSigningKeyBase64 | default (.Values.broker.thirdPartyOauth2.jweSigningKey | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-identity-broker.fullname" . }}-jwe-key
  namespace: {{ include "agentic-identity-broker.namespace" . }}
  labels:
    {{- include "agentic-identity-broker.labels" . | nindent 4 }}
type: Opaque
{{ if .Values.secrets.useStringData }}stringData:{{ else }}data:{{ end }}
  signing-key: {{ $key | quote }}
{{- end }}

# Default values for agentic-identity-broker
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of broker pod replicas
replicaCount: 1

# Image configuration
image:
  # -- Container image repository
  repository: agentic-identity-broker
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to chart appVersion if not set)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""
# -- Override the full resource name
fullnameOverride: ""

# ServiceAccount configuration
serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- ServiceAccount name (generated if not set)
  name: ""

  # IRSA configuration (AWS IAM Roles for Service Accounts)
  # Enable this when running in AWS EKS to bind an IAM role to the ServiceAccount
  irsa:
    # -- Enable IRSA annotation injection
    enabled: false
    # -- IAM role ARN or name to bind to the ServiceAccount
    # Can be an ARN: "arn:aws:iam::123456789012:role/IdentityBrokerEncryptionRole-prod"
    # Or a role name: "IdentityBrokerEncryptionRole-prod"
    role: ""

# -- Pod annotations
podAnnotations: {}

# -- Common labels applied to all resources
commonLabels: {}

# Namespace configuration
namespace:
  # -- Create a Namespace resource
  create: false
  # -- Namespace name (defaults to .Release.Namespace if empty)
  name: ""

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000

# Service configuration
service:
  # -- Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # Port configuration
  ports:
    # -- End-user API port
    enduser: 8000
    # -- Admin API port
    admin: 14000

# Ingress configuration for end-user API
ingress:
  # End-user API Ingress
  enduser:
    # -- Enable Ingress for end-user API
    enabled: false
    # -- Ingress class name (e.g., nginx, skipper)
    className: ""
    # -- Ingress annotations
    # @default -- `{}`
    annotations: {}
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # zalando.org/skipper-filter: ratelimit(50, "1m")
    # -- Ingress hosts configuration
    hosts:
      - host: broker.example.com
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration
    tls: []
    #  - secretName: broker-tls
    #    hosts:
    #      - broker.example.com

  # Admin API Ingress
  admin:
    # -- Enable Ingress for admin API
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress annotations (consider IP whitelisting for admin API)
    annotations: {}
      # nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8"
    # -- Ingress hosts configuration
    hosts:
      - host: broker-admin.internal.example.com
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration
    tls: []

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Autoscaling configuration (optional)
autoscaling:
  # -- Enable HorizontalPodAutoscaler
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# PodDisruptionBudget configuration (optional)
podDisruptionBudget:
  # -- Enable PodDisruptionBudget
  enabled: false
  # -- Minimum available pods
  minAvailable: 1
  # maxUnavailable: 1

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# Storage configuration
storage:
  # -- Storage type: "memory" or "postgres"
  # memory = in-memory storage (ephemeral, for evaluation only)
  # postgres = PostgreSQL database (persistent)
  type: memory

# PostgreSQL configuration
postgresql:
  # External PostgreSQL configuration
  # Use this for existing PostgreSQL instances
  external:
    # -- Enable external PostgreSQL
    enabled: false
    # -- PostgreSQL host
    host: postgres.database.svc.cluster.local
    # -- PostgreSQL port
    port: 5432
    # -- Database name
    database: broker
    # -- SSL mode (disable, require, verify-ca, verify-full)
    sslMode: require

    # Migration user credentials (schema permissions)
    # -- Kubernetes Secret name containing migration user credentials
    migrationSecretName: broker-db-migration
    # -- Secret keys for migration credentials
    migrationSecretKeys:
      # -- Username key in secret
      username: username
      # -- Password key in secret
      password: password

    # Broker user credentials (runtime data access)
    # -- Kubernetes Secret name containing broker user credentials
    brokerSecretName: broker-db
    # -- Secret keys for broker credentials
    brokerSecretKeys:
      # -- Username key in secret
      username: username
      # -- Password key in secret
      password: password

  # Zalando PostgreSQL Operator configuration
  # Use this to provision PostgreSQL via Zalando operator
  operator:
    # -- Enable Zalando PostgreSQL Operator integration
    enabled: false
    # -- Team ID (required by Zalando operator)
    teamId: ""
    # -- PostgreSQL version
    version: "17"
    # -- Number of PostgreSQL instances (cluster size)
    numberOfInstances: 2
    # -- Database name
    database: broker

    # Volume configuration
    volume:
      # -- Persistent volume size
      size: 10Gi
      # -- Storage class (optional, uses cluster default if not set)
      storageClass: ""

    # Resource configuration for PostgreSQL pods
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Init container resources (wait for postgres)
    initContainerResources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 64Mi

    # User configuration
    # Migration user is the database owner; broker user has no special role attributes.
    # Required table/sequence permissions for the broker user are applied post-migration via grants.
    users:
      # Migration user (database owner, no extra role attributes required)
      migration:
        # -- Migration user name (must be RFC 1123 compliant: lowercase, alphanumeric, hyphens only)
        name: broker-migration
        # -- Migration user role attributes (no special attributes; DB ownership is set via databases config)
        permissions: []
      # Broker user (runtime data access; privileges granted post-migration)
      broker:
        # -- Broker user name (must be RFC 1123 compliant: lowercase, alphanumeric, hyphens only)
        name: broker
        # -- Broker user role attributes (no special attributes; grants are applied post-migration)
        permissions: []

    # -- Secret name suffix for operator-managed credentials
    # Set to "" to omit the suffix entirely
    secretSuffix: "postgresql.acid.zalan.do"

  # -- Labels applied only to the PostgreSQL resource
  labels: {}
  # -- Annotations applied only to the PostgreSQL resource
  annotations: {}

# Migration Job configuration
migration:
  # -- Run database migrations (automatically enabled when storage.type=postgres)
  enabled: true

  # Migration image configuration (separate from broker image for security)
  image:
    # -- Migration container image repository
    repository: agentic-identity-broker-migrate
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag (defaults to chart appVersion if not set)
    tag: ""

  # Helm hook configuration
  # -- Hook weight (controls execution order, negative runs earlier)
  hookWeight: -5

  # Job configuration
  # -- Job backoff limit (retry attempts)
  # Higher value needed for Zalando operator as PostgreSQL takes time to initialize
  backoffLimit: 10
  # -- TTL for completed/failed jobs (cleanup delay in seconds)
  ttlSecondsAfterFinished: 300

  # Resource limits for migration Job
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Database grants configuration
  grants:
    # -- Enable automatic privilege grants after migration completes
    # When enabled, the migration Job runs schema migrations first (as an init container),
    # then applies SQL grants to the broker application user (as the main container).
    enabled: true
    # -- PostgreSQL client image used to run the grants script
    image: postgres:17-alpine
    # -- Custom grants SQL script (optional)
    # If empty, the default grants are applied:
    #   GRANT CONNECT ON DATABASE ... TO <broker_user>
    #   GRANT USAGE ON SCHEMA public TO <broker_user>
    #   GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO <broker_user>
    #   GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO <broker_user>
    # Use the psql variable :broker_user to reference the broker username.
    sql: ""

# Broker application configuration
broker:
  # -- Additional broker environment variables (supports value or valueFrom)
  extraEnv: []

  # Logging
  log:
    # -- Log level (debug, info, warn, error)
    level: info
    # -- Log format (json, text)
    format: json

  # Server configuration
  server:
    # End-user server
    enduser:
      # -- End-user server port (must match service.ports.enduser)
      port: 8000
      # -- Bind address
      bind: "::"
      # -- Public URL for end-user API (required for OAuth2 metadata)
      publicUrl: ""
      # Authentication
      authentication:
        preauth:
          # -- Header name containing authenticated principal (omit to disable plain-header pre-auth)
          principalHeaderName: ""
        # -- JWT pre-authentication configuration (optional)
        # Extracts the principal and profile attributes from a JWT provided by an
        # upstream reverse proxy, API gateway, or service mesh.
        # See examples/config/jwt-preauth.yaml for full documentation.
        # jwt:
        #   header_name: Authorization
        #   verification: jwks          # "jwks" or "none"
        #   jwks_uri: ""                # Required when verification is "jwks"
        #   expected_audience: ""
        #   expected_issuer: ""
        #   claim_extraction:
        #     principal_expression: "claims.sub"
        #     display_name_expression: "claims.name"
        #     email_expression: "claims.email"
        #     picture_url_expression: "claims.picture"

    # Admin server
    admin:
      # -- Admin server port (must match service.ports.admin)
      port: 14000
      # -- Bind address
      bind: "::"
      # -- Public URL for admin API
      publicUrl: ""
      # Authentication
      authentication:
        preauth:
          # -- Header name containing authenticated principal (omit to disable plain-header pre-auth)
          principalHeaderName: ""

    # Graceful shutdown
    shutdown:
      # -- Graceful shutdown timeout
      timeout: 30s

  # Request security context configuration
  requestContext:
    trustedProxy:
      # -- Trust forwarded headers from an upstream proxy when deriving caller IPs
      enabled: false
      # -- Forwarded header to inspect when trustedProxy.enabled is true
      forwardedHeader: X-Forwarded-For
    trace:
      # -- Emit the additive W3C traceresponse response header on HTTP responses
      responseEnabled: true

  # OAuth2 configuration
  thirdPartyOauth2:
    # -- JWE signing key for state tokens (required, load from secret)
    # Raw 32-byte key material; this value will be base64-encoded by the chart when creating the Secret.
    # Set via environment variable or Kubernetes Secret
    jweSigningKey: ""
    # -- Base64-encoded JWE signing key (used directly if set; do not provide raw bytes here)
    # This value must already be base64-encoded, as it is written to stringData without additional encoding.
    # Precedence order (highest to lowest): jweSigningKeyBase64 > jweSigningKey > jweSigningKeySecret
    jweSigningKeyBase64: ""
    # -- Secret reference for JWE signing key (alternative to jweSigningKey)
    jweSigningKeySecret:
      name: ""
      key: signing-key

  # -- Encryption configuration
  encryption:
    # -- In-memory encryption backend configuration
    memory:
      # -- Base64-encoded 32-byte key for the in-memory encryption backend
      rawKey: ""
    # -- AWS KMS encryption backend configuration
    awsKms:
      # -- ARN of the AWS KMS key used for encryption
      keyArn: ""
      # -- DynamoDB table name for storing branch encryption keys
      dynamodbTableName: "IdentityBrokerEncryptionBranchKeys"
      # -- Time-to-live for branch keys (e.g., 1h, 24h)
      branchKeyTtl: "1h"
      # -- AWS region for KMS and SDK base configuration
      region: ""
      # -- AWS region of the DynamoDB table
      dynamodbRegion: ""
      # -- Timeout for DynamoDB operations (context timeout applied per call, e.g., "5s", "10s")
      dynamodbTimeout: ""

  # OAuth2 Authorization Server configuration
  oauth2AuthorizationServer:
    # -- Operation mode: "proxy", "local", or "hybrid". Required.
    # proxy: forward all requests to an upstream OAuth2 server (proxy.* required)
    # local: issue tokens locally (no proxy config required; token TTL defaults to 1h)
    # hybrid: serve both proxy and local agents (both proxy.* and local.* required)
    mode: "local"

    # -- Upstream OAuth2 server configuration (required in proxy/hybrid mode)
    proxy:
      # -- Upstream OAuth2 issuer URI
      upstreamIssuerUri: ""
      # -- Upstream authorize endpoint
      upstreamAuthorizeEndpoint: ""
      # -- Upstream token endpoint
      upstreamTokenEndpoint: ""
      # -- Upstream request timeout (empty = use application default of 30s; accepts Go duration syntax: 30s, 500ms)
      upstreamTimeout: ""
      # -- Minimum interval between upstream JWKS refresh attempts. Empty = application default of 15m.
      upstreamJwksMinRefresh: ""
      # -- Maximum interval between upstream JWKS refresh attempts. Empty = application default of 1h.
      upstreamJwksMaxRefresh: ""

    # -- Supported OAuth2 response types (empty = use mode-specific defaults: ["code"])
    supportedResponseTypes: []
    # -- Supported OAuth2 grant types (empty = use mode-specific defaults per mode)
    supportedGrantTypes: []
    # Client ID Metadata Document (CIMD) support
    # Enables AI agents to identify using HTTPS URLs as client_id.
    cimd:
      # -- Enable URL-based client_id support. Default: false.
      enabled: false
      # -- HTTP timeout for CIMD document fetches. Default: 1s.
      fetchTimeout: 1s
      # -- Maximum response body size in bytes. Default: 5120.
      maxResponseBytes: 5120
      cache:
        # -- Maximum TTL for cached documents (HTTP max-age clamped to this). Default: 1h.
        maxTtl: 1h
        # -- Minimum TTL for cached documents. Default: 60s.
        minTtl: 60s
      ssrf:
        # -- Extra CIDR ranges blocked for CIMD fetches beyond RFC 6890 defaults. Default: [].
        extraBlockedCidrs: []
      # -- Keyword blocklist for CIMD client_name values (case-insensitive). Default: [].
      clientNameBlocklist: []

    # Local token issuance configuration (local/hybrid mode)
    local:
      # -- Access token TTL (e.g. "1h", "30m"). Defaults to 1h if empty.
      tokenTtl: ""
      # -- CEL expression for custom token claims. Empty means no extra claims.
      tokenClaimsExpression: ""
      signingKeys:
        # -- Startup budget for signing-key bootstrap in local/hybrid mode. Defaults to 90s if empty.
        bootstrapTimeout: ""

    # RFC 8693 user impersonation (signed or unverified subject). Only valid in "local" mode.
    # Disabled by default (nil): the impersonation block is omitted from the rendered
    # config unless set. Keys use the broker config's snake_case names and are copied
    # verbatim into config.yaml. See examples/config/impersonation.yaml for a full
    # annotated example.
    # impersonation:
    #   # CR-001: routing-only prefix. Requests append one target agent's canonical lower-case UUID or canonical_id.
    #   audience_prefix: "https://broker.example.com/impersonation"
    #   # CR-002: non-empty, ordered; first-match.
    #   rules:
    #     - name: "internal-gateway-prod"
    #       # CR-003: client_assertion, actor, and subject are all required.
    #       roles:
    #         client_assertion:
    #           expected_audience: "https://broker.example.com/impersonation"
    #           principal_expression: "client_assertion.sub"
    #         actor:
    #           expected_audience: "https://broker.example.com/impersonation"
    #           principal_expression: "actor_token.sub"
    #         subject:
    #           expected_audience: "https://broker.example.com/impersonation"
    #           # A signed role whose IdP mints credentials without an aud claim can instead set
    #           # audience_requirement: absent and omit expected_audience. The authorization predicate
    #           # must reference that role's token (CR-009). The client assertion rule follows.
    #           principal_expression: "subject_token.sub"
    #           email_expression: "has(subject_token.email) ? subject_token.email : ''"
    #       # CR-007/CR-008: trust anchors; asymmetric algorithms only.
    #       trusted_issuers:
    #         - issuer_uri: "https://idp.internal.example.com"
    #           jwks_min_refresh: "15m"
    #           jwks_max_refresh: "1h"
    #           allowed_algorithms: ["ES256", "RS256"]
    #           signs_roles: ["client_assertion", "actor", "subject"]
    #       # CR-005: CEL predicate (token-exchange authorization schema).
    #       authorization:
    #         type: cel
    #         cel:
    #           expression: |
    #             client_assertion.iss == "https://idp.internal.example.com" &&
    #             client_assertion.sub == "gateway-prod"
    #           evaluation_timeout: "100ms"
    #     # Unverified subject (broker profile extension, ADR 031): verification "none",
    #     # no expected_audience, subject absent from signs_roles; the predicate MUST bind
    #     # subject_token and binds subject_token.email so a caller-supplied email is minted.
    #     - name: "chat-bridge-unverified-subject"
    #       roles:
    #         client_assertion:
    #           expected_audience: "https://broker.example.com/impersonation"
    #           principal_expression: "client_assertion.sub"
    #         actor:
    #           expected_audience: "https://broker.example.com/impersonation"
    #           principal_expression: "actor_token.sub"
    #         subject:
    #           verification: "none"
    #           principal_expression: "subject_token.sub"
    #           email_expression: "has(subject_token.email) ? subject_token.email : ''"
    #       trusted_issuers:
    #         - issuer_uri: "https://idp.internal.example.com"
    #           allowed_algorithms: ["ES256", "RS256"]
    #           signs_roles: ["client_assertion", "actor"]
    #       authorization:
    #         type: cel
    #         cel:
    #           expression: |
    #             client_assertion.sub == "chat-bridge" &&
    #             subject_token.sub != "" &&
    #             has(subject_token.email) && subject_token.email.endsWith("@example.com")
    #           evaluation_timeout: "100ms"
    #     # Audience-less client assertion (CR-009): omit expected_audience only when the IdP omits aud.
    #     - name: "audienceless-gateway"
    #       roles:
    #         client_assertion:
    #           audience_requirement: absent
    #           principal_expression: "client_assertion.sub"
    #         actor:
    #           expected_audience: "https://broker.example.com/impersonation"
    #           principal_expression: "actor_token.sub"
    #         subject:
    #           expected_audience: "https://broker.example.com/impersonation"
    #           principal_expression: "subject_token.sub"
    #       trusted_issuers:
    #         - issuer_uri: "https://idp.internal.example.com"
    #           allowed_algorithms: ["ES256", "RS256"]
    #           signs_roles: ["client_assertion", "actor", "subject"]
    #       authorization:
    #         type: cel
    #         cel:
    #           expression: 'client_assertion.sub == "audienceless-gateway"'
    #           evaluation_timeout: "100ms"


    # Multi-agent client sharing (Feature 021)
    # When enabled, multiple agents may share the same upstream OAuth2 client_id.
    # Requires both agentIdParamName and agentIdClaimName when enabled.
    multiAgentClient:
      # -- Enable multi-agent client sharing. Default: false.
      # When false, upstream client_id uniqueness per agent is enforced and the
      # resolveAgentIdByClientId CEL helper is registered for token exchange policies.
      enabled: false
      # -- Name of the query parameter injected into the upstream authorize redirect
      # carrying the agent's internal UUID (e.g. "x_agent_id"). Required when enabled.
      agentIdParamName: ""
      # -- Name of the JWT claim the upstream server embeds in minted tokens containing
      # the agent's internal UUID (e.g. "x_agent_id"). Required when enabled.
      agentIdClaimName: ""

  # Token exchange configuration (RFC 8693)
  tokenExchange:
    # -- Expected audience (aud) claim value for subject_token and client_assertion JWTs.
    # Defaults to "token-exchange-broker" if empty.
    expectedAudience: ""
    clientAssertion:
      # -- External IdP issuer for privileged-gateway client assertions. Required for configured
      # token exchange in local mode; empty defaults to the proxy upstream issuer in proxy/hybrid mode.
      issuerUri: ""
      # -- Explicit client-assertion JWKS endpoint. Empty discovers it from issuerUri.
      jwksUri: ""
      # -- Minimum client-assertion JWKS refresh interval. Empty defaults to 15m.
      jwksMinRefresh: ""
      # -- Maximum client-assertion JWKS refresh interval. Empty defaults to max(jwksMinRefresh, 1h).
      jwksMaxRefresh: ""

    claimExtraction:
      # -- CEL expression to extract the user principal from subject_token.
      # Default: "subject_token.sub"
      principalExpression: "subject_token.sub"
      # -- CEL expression to extract the agent identifier from subject_token.
      # When multiAgentClient.enabled = false (default): use resolveAgentIdByClientId to map
      # upstream client_id → broker agent.id UUID:
      #   "resolveAgentIdByClientId(subject_token.azp)"
      # When multiAgentClient.enabled = true: read the agent ID claim directly:
      #   "subject_token.x_agent_id"  (use your configured agentIdClaimName)
      agentIdExpression: "resolveAgentIdByClientId(subject_token.azp)"
    authorization:
      # -- Authorization type: "cel" (recommended)
      type: "cel"
      cel:
        # -- CEL boolean expression evaluated per token exchange request.
        # Default: "true" (allow all valid clients with valid JWTs).
        expression: "true"
        # -- CEL evaluation timeout (e.g. "100ms", "5s")
        evaluationTimeout: "100ms"

  # Security configuration
  security:
    # -- Skip HTTPS validation for third-party services (dev/test only!)
    skipThirdpartyHttpsValidation: false

  # OpenTelemetry observability configuration
  telemetry:
    # -- Enable OpenTelemetry distributed tracing and metrics export
    enabled: false
    # -- Service name reported in every telemetry signal
    serviceName: agentic-identity-broker
    # -- Additional OTel resource attributes attached to every signal
    # @default -- `{}`
    resourceAttributes: {}
      # deployment.environment: production
      # service.version: "1.0.0"
      # cloud.region: eu-west-1

    # Distributed tracing configuration
    traces:
      # -- Enable trace export via OTLP
      enabled: true
      # -- Fractional sampling rate (0.0–1.0). `1.0` = 100% sampled.
      # 1.0 is the default (useful for development and low-traffic services).
      # In production, reduce to e.g. `0.1` (10 %) to limit overhead and cost.
      samplingRate: 1.0
      # -- Trace-context propagators to register globally.
      # Supported: ottrace (OpenTracing), b3multi (Zipkin B3 multiple headers),
      # b3 (B3 single header), tracecontext (W3C), baggage (W3C).
      # Propagators are registered unconditionally when telemetry is enabled.
      propagators:
        - tracecontext
        - ottrace
        - b3multi
        - baggage

    # Metrics collection and export configuration
    metrics:
      # -- Enable metrics export via OTLP
      enabled: true
      # -- How often metrics are pushed to the collector. Must be positive. Example: `30s`, `1m`.
      exportInterval: 30s

    # OTLP log export configuration
    logs:
      # -- Enable OTLP log export via the slog bridge.
      # Set to false if the collector does not support
      # opentelemetry.proto.collector.logs.v1.LogsService.
      enabled: true

    # OTLP exporter connection parameters
    exporter:
      # -- Transport protocol: `grpc` (default), `http`, or `https`
      # `https` uses the HTTP OTLP exporter with TLS; bare host:port auto-prefixed with https://
      protocol: grpc
      # -- OTLP collector endpoint.
      # gRPC: `host:port` (e.g. `otel-collector.monitoring.svc:4317`)
      # HTTP/HTTPS: full URL (e.g. `https://otel-collector.monitoring.svc:4318`)
      # Can also be set via env var `IDENTITY_BROKER_TELEMETRY_EXPORTER_ENDPOINT`.
      endpoint: ""
      # -- Additional HTTP/gRPC headers sent with every export request.
      # Useful for authentication tokens. Reference secrets via `${ENV_VAR}` notation.
      # @default -- `{}`
      headers: {}
        # Authorization: "Bearer ${OTEL_EXPORTER_AUTH_TOKEN}"
      # -- Export request timeout (e.g. `10s`, `30s`)
      timeout: 10s
      # -- Payload compression for all OTLP exporters. `none` (default) or `gzip`.
      compression: none
      # -- Disable TLS for the OTLP connection (insecure mode).
      # Only meaningful for gRPC; for HTTP the URL scheme controls TLS.
      # MUST NOT be set to `true` in production.
      insecure: false

  # -- Additional broker configuration (merged into config.yaml)
  extraConfig: {}

# Tool Approval configuration
approvals:
  # -- Time before a pending approval expires
  pending_ttl: "10m"
  # -- Coalesce window for long-poll sync notifications
  sync_coalesce_window: "1s"
  rate_limit:
    # -- Maximum pending approvals per (principal, agent) pair
    max_pending_per_pair: 50
    # -- Maximum approval creation requests per minute per (principal, agent) pair
    max_requests_per_minute: 10

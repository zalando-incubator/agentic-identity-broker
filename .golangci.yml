version: "2"

linters:
  enable:
    - forbidigo
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          pkg: ^fmt$
          msg: Log through the injected *slog.Logger (coding-standards/LOGGING.md section 1).
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          pkg: ^log$
          msg: Log through the injected *slog.Logger (coding-standards/LOGGING.md section 1).
  exclusions:
    paths:
      - web/node_modules
    rules:
      - path: ^(cmd|tools)/
        linters:
          - forbidigo

version: "2"

linters:
  enable:
    - forbidigo
    - sloglint
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          pkg: ^fmt$
          msg: Log through the injected *slog.Logger (coding-standards/LOGGING.md section 1).
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          pkg: ^log$
          msg: Log through the injected *slog.Logger (coding-standards/LOGGING.md section 1).
        - pattern: ^log\.Output$
          pkg: ^log$
          msg: Log through the injected *slog.Logger (coding-standards/LOGGING.md section 1).
        - pattern: log\.Logger\)?\.(Print|Fatal|Panic|Output)(f|ln)?$
          pkg: ^log$
          msg: Log through the injected *slog.Logger (coding-standards/LOGGING.md section 1).
    sloglint:
      context: scope
      static-msg: true
      key-naming-case: snake
  exclusions:
    paths:
      - web/node_modules
    rules:
      - path: ^(cmd|tools)/
        linters:
          - forbidigo
      # LOGGING.md section 2.3: a namespaced family joins snake_case segments with dots.
      - linters:
          - sloglint
        text: keys should be written in snake_case
        source: '"token_exchange(\.[a-z0-9_]+)+"'

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @import url('https://fonts.bunny.net/css?family=zalando-sans:300,700');

      .monogram {
        font-family: 'Zalando Sans', sans-serif;
        font-size: 38px;
        letter-spacing: -0.07em;
        text-rendering: optimizeLegibility;
        fill: #000000;
      }

      .bold-text {
        font-weight: 700;
      }

      .light-text {
        font-weight: 300;
      }
    </style>
  </defs>
  <rect width="64" height="64" fill="#ffffff" />
  <text class="monogram" x="32" y="45" text-anchor="middle"><tspan class="bold-text">ai</tspan><tspan class="light-text">b</tspan></text>
</svg>

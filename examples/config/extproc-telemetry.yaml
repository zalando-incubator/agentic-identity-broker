# UNREACHABLE COLLECTOR EXAMPLE (for resilience testing)
# Demonstrates graceful degradation when the collector is unavailable
# The service continues processing token exchanges normally; export failures are handled by the OTel SDK
#
# telemetry:
#   enabled: true
#   service_name: extproc-token-exchange
#
#   traces:
#     enabled: true
#     sampling_rate: 1.0
#     propagators:
#       - tracecontext
#
#   metrics:
#     enabled: true
#
#   logs:
#     enabled: true
#
#   exporter:
#     protocol: grpc
#     endpoint: "unreachable-collector.invalid:4317"  # Intentionally unreachable
#     timeout: 5s
#     insecure: false
#
# With this configuration, the service starts successfully and all token exchanges proceed normally.
# No telemetry is exported, but token exchange continues unaffected (FR-008).

---

# TRACES DISABLED, PROPAGATION ENABLED (context forwarding without local spans)
# This configuration enables context extraction and forwarding but disables local span creation.
# Useful when only forwarding trace context is desired without the overhead of local instrumentation.
#
# telemetry:
#   enabled: true
#   service_name: extproc-token-exchange
#
#   traces:
#     enabled: false  # No local spans created or exported
#     propagators:
#       - tracecontext
#       - b3multi
#
#   metrics:
#     enabled: false
#
#   logs:
#     enabled: false
#
#   exporter:
#     protocol: grpc
#     endpoint: "otel-collector:4317"
#
# With this configuration:
# - Inbound trace context is extracted from agentgateway's traceparent headers
# - Context is forwarded to the identity broker's outbound HTTP requests
# - No ExtProc spans are recorded
# - No metrics or logs are exported
# This mode is useful for scenarios where the service should remain transparent to tracing without overhead.

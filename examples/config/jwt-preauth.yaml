# JWT Pre-Authentication Configuration Examples
#
# Configure JWT pre-authentication with a JWKS endpoint on either server.
# The broker verifies each JWT signature before it reads principal or profile
# claims from a reverse proxy, API gateway, or service mesh.
#
# When `authentication.jwt` is configured, requests missing the JWT header
# fail closed with 401. The plain pre-auth header is not used as a runtime
# fallback.
#
# For full documentation see: docs/configuration.md

# =============================================================================
# Example 1: Signed JWT with JWKS Verification
# =============================================================================
# Use when a reverse proxy or gateway issues signed JWTs.
# The JWT must include an unexpired exp claim.
#
# server:
#   enduser:
#     port: 8000
#     authentication:
#       preauth:
#         principal_header_name: X-Remote-User
#       jwt:
#         header_name: Authorization              # Default; strips "Bearer " prefix
#         # verification: jwks                    # Default when omitted
#         jwks_uri: https://auth.example.com/.well-known/jwks.json
#         expected_audience: agentic-identity-broker
#         expected_issuer: https://auth.example.com
#         claim_extraction:
#           principal_expression: "claims.sub"
#           display_name_expression: "claims.name"
#           email_expression: "claims.email"
#           picture_url_expression: "claims.picture"

# =============================================================================
# Example 2: Plain Header Pre-Authentication
# =============================================================================
# This configuration extracts principals from the X-Remote-User header.
# JWT authentication is not enabled.
#
# server:
#   enduser:
#     port: 8000
#     authentication:
#       preauth:
#         principal_header_name: X-Remote-User

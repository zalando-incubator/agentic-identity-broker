# RFC 8693 OAuth 2.0 Token Exchange Configuration Example
# This configuration enables the identity broker to exchange tokens on behalf of privileged clients,
# allowing agents to access third-party OAuth2 services using user credentials previously
# authenticated with the upstream OAuth2 server.

# Token exchange configuration
token_exchange:
  # Client-assertion trust anchor for privileged gateway credentials.
  # Required in local mode when token exchange is configured. In proxy/hybrid mode,
  # omit this block to use oauth2_authorization_server.proxy.upstream_issuer_uri.
  # It MUST be an external IdP; broker-minted tokens are never valid client assertions.
  # client_assertion:
  #   issuer_uri: "https://privileged-gateway-idp.example.com"
  #   # Optional when the IdP does not support discovery:
  #   jwks_uri: "https://privileged-gateway-idp.example.com/keys"
  #   # Refresh defaults: min 15m; max max(jwks_min_refresh, 1h).
  #   jwks_min_refresh: "15m"
  #   jwks_max_refresh: "1h"

  # Claim extraction configures CEL expressions to extract claims from subject_token
  claim_extraction:
    # principal_expression extracts the user principal/subject from the subject_token JWT.
    # Expression should return a string representing the authenticated user.
    # Default: "subject_token.sub" (extracts the 'sub' claim)
    # Examples:
    #   - "subject_token.sub"                    # Standard sub claim
    #   - "subject_token.email"                  # Custom: use email claim
    #   - "subject_token.preferred_username"     # Custom: use preferred_username
    principal_expression: "subject_token.sub"

    # agent_id_expression extracts the agent/application client ID from subject_token.
    # Expression MUST return the agent's internal UUID (agent.id), NOT the upstream client_id string.
    #
    # IMPORTANT: Choose the correct expression based on your multi_agent_client configuration:
    #
    # When multi_agent_client.enabled = false (default):
    #   Use the resolveAgentIdByClientId() CEL helper to map upstream client_id → broker agent.id:
    #   agent_id_expression: "resolveAgentIdByClientId(subject_token.azp)"
    #
    # When multi_agent_client.enabled = true:
    #   Use the configured agent_id_claim_name claim directly (contains agent.id UUID):
    #   agent_id_expression: "subject_token.x_agent_id"  # use configured claim name
    #
    agent_id_expression: "resolveAgentIdByClientId(subject_token.azp)"

  # Authorization configures privileged client authorization rules
  authorization:
    # type specifies the authorization method to use
    # Options:
    #   - "cel": CEL expression-based authorization (current implementation)
    #   - "opa": OPA policy engine (reserved for future implementation)
    type: "cel"

    # CEL authorization configuration
    cel:
      # expression is a CEL boolean expression evaluated for each request
      # Expression context includes:
      #   - client_assertion: validated client assertion JWT claims (privileged client identity)
      #   - subject_token: validated subject token JWT claims (user identity)
      #   - request: request context with resource, grant_type, scope
      #
      # Expression must return a boolean:
      #   - true: authorization succeeds, proceed with token exchange
      #   - false: authorization fails, return 403 access_denied error
      #
      # Default: "true" (allow all valid privileged clients with valid JWTs)
      #
      # Examples:
      #   - 'true'                                                        # Allow all
      #   - 'client_assertion.iss == "https://trusted-privileged-client.example.com"'  # Only trusted issuer
      #   - 'client_assertion.sub in ["privileged-client-1", "privileged-client-2"]'        # Whitelist specific privileged clients
      #   - 'client_assertion.claims.tier == "production"'              # Only production privileged clients
      #   - 'has(client_assertion.claims.org_id) && client_assertion.claims.org_id == subject_token.claims.org_id'  # Same org
      #   - '"admin" in subject_token.claims.roles'                     # Only admin users
      expression: 'true'

  # Refresh configures automatic token refresh behavior
  refresh:
    # enabled determines whether expired access tokens should be automatically refreshed
    # using the stored refresh_token.
    # Default: true (enable automatic refresh)
    # Options:
    #   - true: If access_token is expired but refresh_token is valid, attempt refresh
    #   - false: Never attempt refresh; return invalid_grant error for expired tokens
    enabled: true

# EXTERNAL CONFIGURATION REFERENCE
# ================================
# Upstream OAuth2 configuration:
#
# upstream_oauth2:
#   issuer: "https://auth.example.com"              # Must match client_assertion and subject_token iss claim
#   jwks_uri: "https://auth.example.com/.well-known/jwks.json"  # JWKS endpoint for JWT validation
#   # (other upstream OAuth2 config)
#
# These are referenced in token exchange but configured separately in the main config.yaml

# COMPLETE MINIMAL EXAMPLE (multi_agent_client.enabled = false — default)
# ========================================================================
# token_exchange:
#   claim_extraction:
#     principal_expression: "subject_token.sub"
#     agent_id_expression: "resolveAgentIdByClientId(subject_token.azp)"
#   authorization:
#     type: "cel"
#     cel:
#       expression: "true"
#   refresh:
#     enabled: true

# COMPLETE MINIMAL EXAMPLE (multi_agent_client.enabled = true)
# =============================================================
# token_exchange:
#   claim_extraction:
#     principal_expression: "subject_token.sub"
#     agent_id_expression: "subject_token.x_agent_id"  # use configured agent_id_claim_name
#   authorization:
#     type: "cel"
#     cel:
#       expression: "true"
#   refresh:
#     enabled: true


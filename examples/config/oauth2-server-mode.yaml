# OAuth2 Server Mode Configuration
#
# Configures the identity broker to operate as a standalone OAuth2 authorization
# server, issuing its own JWT access tokens signed with managed keys.
#
# In this mode ("local"), the broker:
#   - Issues JWT access tokens directly (no upstream OAuth2 server needed)
#   - Supports client_credentials and authorization_code (with PKCE) grant types
#   - Manages ES256 signing keys with encrypted private material
#   - Exposes RFC 8414 discovery and JWKS endpoints
#
# Upstream OAuth2 URI fields are not required in local mode.
# Feature 049 refresh policy applies to broker-issued local refresh sessions.

# Dual-server architecture: end-user and admin on separate ports
server:
  enduser:
    port: 8000
    bind: "0.0.0.0"
    public_url: "https://broker.example.com"
    authentication:
      preauth:
        principal_header_name: "X-Remote-User"
  admin:
    port: 14000
    bind: "0.0.0.0"
    public_url: "https://broker.example.com:14000"
    authentication:
      preauth:
        principal_header_name: "X-Remote-User"

# OAuth2 authorization server configuration
oauth2_authorization_server:
  # Mode: "proxy" (default), "local", or "hybrid"
  # In "local" mode, the broker mints its own tokens.
  mode: "local"

  # Local section: token issuance configuration (required in local/hybrid mode)
  local:
    # Issued access JWTs remain valid for up to token_ttl after consent revocation.
    # A shorter token_ttl reduces this residual exposure; it does not shorten existing JWTs.
    token_ttl: "1h"

    # Recovery of the immediately previous refresh result (maximum three returns).
    # Default: 30s. Set 0s for strict single use, without a retry result.
    refresh_token_reuse_interval: "30s"
    # Default: 0s (no absolute deadline). A finite value such as 168h
    # counts from first issuance; consent and inactivity still apply at 0s.
    absolute_session_lifetime: "0s"
    # Session inactivity since issuance or the last fresh successful rotation.
    # Default: 720h (30 days). Omitted or 0s retains the 720h default.
    # Retries and resource access do not renew inactivity.
    # A policy increase applies only after the next valid fresh rotation.
    refresh_token_ttl: "720h"

    # CEL expression evaluated at token issuance to produce custom JWT claims.
    # Available variables: agent (Agent struct), principal (string), request (map).
    # Must return map[string]dyn. Base claims (iss, sub, exp, etc.) cannot be overridden.
    # Empty string means no custom claims.
    # Example: adds team label from agent display name
    token_claims_expression: '{"team": agent.display_name}'

    signing_keys:
      # Startup budget for initial signing-key bootstrap in local mode.
      bootstrap_timeout: 90s

# Storage backend
storage:
  backend: "memory" # One instance; restart loses all refresh sessions. Use shared PostgreSQL for production.

# Encryption for signing key private material
encryption:
  memory:
    raw_key: "base64-encoded-32-byte-key" # Use "aws_kms" for production

# Logging
log:
  level: "info"
  format: "json"

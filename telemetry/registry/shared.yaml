# Attributes that more than one instrumentation scope sets.
file_format: definition/2

attributes:
  - key: error.type
    type:
      members:
        - {id: assertion_expired, value: "assertion_expired", stability: development}
        - {id: caller_canceled, value: "caller_canceled", stability: development}
        - {id: circuit_open, value: "circuit_open", stability: development}
        - {id: configuration, value: "configuration", stability: development}
        - {id: conflict, value: "conflict", brief: "Operation conflicts with existing data.", stability: development}
        - {id: connection, value: "connection", brief: "Storage backend connection failed or disconnected.", stability: development}
        - {id: internal, value: "internal", stability: development}
        - {id: invalid_response, value: "invalid_response", stability: development}
        - {id: jwks_unavailable, value: "jwks_unavailable", stability: development}
        - {id: network_error, value: "network_error", stability: development}
        - {id: none, value: "none", stability: development}
        - {id: not_found, value: "not_found", brief: "Requested entity does not exist.", stability: development}
        - {id: rejected, value: "rejected", stability: development}
        - {id: response_close_failed, value: "response_close_failed", stability: development}
        - {id: response_read_failed, value: "response_read_failed", stability: development}
        - {id: timeout, value: "timeout", brief: "Operation exceeded its timeout deadline.", stability: development}
        - {id: unavailable, value: "unavailable", stability: development}
        - {id: unknown, value: "unknown", brief: "Error cause is unknown or unexpected.", stability: development}
        - {id: validation, value: "validation", brief: "Input validation failed.", stability: development}
    brief: "Class of the error. Set when the operation fails."
    stability: development
  - key: http.request.method
    type: string
    brief: "HTTP method: an allowlisted method, `_OTHER` otherwise."
    stability: development
  - key: http.response.status_code
    type: int
    brief: "HTTP status code."
    stability: development
  - key: outcome
    type:
      members:
        - {id: aborted, value: "aborted", stability: development}
        - {id: canceled, value: "canceled", stability: development}
        - {id: completed, value: "completed", stability: development}
        - {id: deny, value: "deny", stability: development}
        - {id: elicit, value: "elicit", stability: development}
        - {id: proceed, value: "proceed", stability: development}
        - {id: rejected, value: "rejected", stability: development}
    brief: "Result of the operation that the metric records. Each metric has its own values."
    stability: development
  - key: token_exchange.exchange_kind
    type:
      members:
        - {id: impersonation, value: "impersonation", stability: development}
        - {id: third_party, value: "third_party", stability: development}
        - {id: unknown, value: "unknown", stability: development}
    brief: "Kind of exchange: a third-party service token or user impersonation. ExtProc sets `unknown` when it cannot tell."
    stability: development
  - key: token_exchange.failure_detail
    type:
      members:
        - {id: access_token_expired, value: "access_token_expired", stability: development}
        - {id: agent_invalid, value: "agent_invalid", stability: development}
        - {id: agent_missing, value: "agent_missing", stability: development}
        - {id: agent_repository_unavailable, value: "agent_repository_unavailable", stability: development}
        - {id: authorization_denied, value: "authorization_denied", stability: development}
        - {id: broker_response_invalid, value: "broker_response_invalid", stability: development}
        - {id: broker_unavailable, value: "broker_unavailable", stability: development}
        - {id: caller_canceled, value: "caller_canceled", stability: development}
        - {id: cel_configuration, value: "cel_configuration", stability: development}
        - {id: cel_evaluation_failed, value: "cel_evaluation_failed", stability: development}
        - {id: circuit_open, value: "circuit_open", stability: development}
        - {id: client_expired, value: "client_expired", stability: development}
        - {id: client_invalid, value: "client_invalid", stability: development}
        - {id: client_policy_denied, value: "client_policy_denied", stability: development}
        - {id: configuration, value: "configuration", stability: development}
        - {id: consent_required, value: "consent_required", stability: development}
        - {id: credential_identity_changed, value: "credential_identity_changed", stability: development}
        - {id: credential_rejected, value: "credential_rejected", stability: development}
        - {id: credential_source_unavailable, value: "credential_source_unavailable", stability: development}
        - {id: grant_empty, value: "grant_empty", stability: development}
        - {id: grant_expired, value: "grant_expired", stability: development}
        - {id: grant_missing, value: "grant_missing", stability: development}
        - {id: grant_permission_set_missing, value: "grant_permission_set_missing", stability: development}
        - {id: grant_permission_set_undeclared, value: "grant_permission_set_undeclared", stability: development}
        - {id: grant_repository_unavailable, value: "grant_repository_unavailable", stability: development}
        - {id: grant_scope_intersection_empty, value: "grant_scope_intersection_empty", stability: development}
        - {id: grant_service_definition_missing, value: "grant_service_definition_missing", stability: development}

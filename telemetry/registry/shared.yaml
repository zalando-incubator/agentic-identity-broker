        - {id: resource_repository_unavailable, value: "resource_repository_unavailable", stability: development}
        - {id: resource_unregistered, value: "resource_unregistered", stability: development}
        - {id: response_write_failed, value: "response_write_failed", stability: development}
        - {id: session_configuration, value: "session_configuration", stability: development}
        - {id: session_decryption_failed, value: "session_decryption_failed", stability: development}
        - {id: session_encryption_failed, value: "session_encryption_failed", stability: development}
        - {id: session_missing, value: "session_missing", stability: development}
        - {id: session_persistence_failed, value: "session_persistence_failed", stability: development}
        - {id: session_reauth_required, value: "session_reauth_required", stability: development}
        - {id: session_repository_unavailable, value: "session_repository_unavailable", stability: development}

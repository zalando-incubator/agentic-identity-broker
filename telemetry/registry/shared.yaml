        - {id: subject_invalid, value: "subject_invalid", stability: development}
    brief: "Detail code of the failure. An unclassified failure has `internal_unclassified`, and a successful metric observation has `none`."
    stability: development
  - key: token_exchange.failure_stage
    type:
      members:
        - {id: client_authorization, value: "client_authorization", stability: development}
        - {id: client_validation, value: "client_validation", stability: development}
        - {id: exchange_routing, value: "exchange_routing", stability: development}
        - {id: grant_authorization, value: "grant_authorization", stability: development}
        - {id: identity_resolution, value: "identity_resolution", stability: development}
        - {id: none, value: "none", stability: development}
        - {id: refresh, value: "refresh", stability: development}
        - {id: request_validation, value: "request_validation", stability: development}
        - {id: resource_resolution, value: "resource_resolution", stability: development}
        - {id: response_write, value: "response_write", stability: development}
        - {id: scope_validation, value: "scope_validation", stability: development}
        - {id: session_lookup, value: "session_lookup", stability: development}
        - {id: subject_validation, value: "subject_validation", stability: development}
    brief: "Step of the exchange that failed. A successful metric observation has `none`."
    stability: development
  - key: token_exchange.outcome
    type:
      members:
        - {id: authentication_failed, value: "authentication_failed", stability: development}
        - {id: authorization_denied, value: "authorization_denied", stability: development}
        - {id: canceled, value: "canceled", stability: development}
        - {id: configuration_error, value: "configuration_error", stability: development}
        - {id: infrastructure_error, value: "infrastructure_error", stability: development}
        - {id: invalid_request, value: "invalid_request", stability: development}
        - {id: reauth_required, value: "reauth_required", stability: development}
        - {id: success, value: "success", stability: development}
    brief: "Result class of the exchange, such as `success`, `authorization_denied` or `reauth_required`."
    stability: development
  - key: token_exchange.recovery_action
    type:
      members:
        - {id: fix_configuration, value: "fix_configuration", stability: development}
        - {id: none, value: "none", stability: development}
        - {id: reauthenticate, value: "reauthenticate", stability: development}
        - {id: reconsent, value: "reconsent", stability: development}
        - {id: retry, value: "retry", stability: development}
    brief: "Recommended way to repair the failure. It is a diagnostic hint, not an instruction to retry."
    stability: development
  - key: token_exchange.recovery_target
    type:
      members:
        - {id: broker_configuration, value: "broker_configuration", stability: development}
        - {id: calling_client, value: "calling_client", stability: development}
        - {id: consent, value: "consent", stability: development}
        - {id: none, value: "none", stability: development}
        - {id: provider_session, value: "provider_session", stability: development}
        - {id: subject_identity, value: "subject_identity", stability: development}
    brief: "What the recovery action applies to, such as the consent or the provider session."
    stability: development

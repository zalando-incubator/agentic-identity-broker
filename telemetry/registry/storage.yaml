# Telemetry of the instrumentation scope `storage`.
file_format: definition/2

attributes:
  - key: db.operation
    type:
      members:
        - {id: approve_tool_approval, value: "ApproveToolApproval", stability: development}
        - {id: authorization_code_repo_create, value: "AuthorizationCodeRepo.Create", stability: development}
        - {id: authorization_code_repo_delete_expired, value: "AuthorizationCodeRepo.DeleteExpired", stability: development}
        - {id: authorization_code_repo_find_by_code_hash, value: "AuthorizationCodeRepo.FindByCodeHash", stability: development}
        - {id: authorization_code_repo_mark_used, value: "AuthorizationCodeRepo.MarkUsed", stability: development}
        - {id: client_assertion_replay_repo_consume, value: "ClientAssertionReplayRepo.Consume", stability: development}
        - {id: client_assertion_replay_repo_delete_expired, value: "ClientAssertionReplayRepo.DeleteExpired", stability: development}
        - {id: client_credential_repo_create, value: "ClientCredentialRepo.Create", stability: development}
        - {id: client_credential_repo_delete, value: "ClientCredentialRepo.Delete", stability: development}
        - {id: client_credential_repo_get_by_agent_id, value: "ClientCredentialRepo.GetByAgentID", stability: development}
        - {id: client_credential_repo_rotate, value: "ClientCredentialRepo.Rotate", stability: development}
        - {id: consume_tool_approval, value: "ConsumeToolApproval", stability: development}
        - {id: count_pending_tool_approvals, value: "CountPendingToolApprovals", stability: development}
        - {id: create_tool_approval, value: "CreateToolApproval", stability: development}
        - {id: create_user_grant, value: "CreateUserGrant", stability: development}
        - {id: deny_tool_approval, value: "DenyToolApproval", stability: development}
        - {id: get_agent, value: "GetAgent", stability: development}
        - {id: get_approval_sync_version, value: "GetApprovalSyncVersion", stability: development}
        - {id: get_tool_approval, value: "GetToolApproval", stability: development}
        - {id: increment_approval_sync_version, value: "IncrementApprovalSyncVersion", stability: development}
        - {id: list_all_active_tool_approvals, value: "ListAllActiveToolApprovals", stability: development}
        - {id: list_by_principal, value: "ListByPrincipal", stability: development}
        - {id: list_permanent_tool_approvals, value: "ListPermanentToolApprovals", stability: development}
        - {id: pkce_session_repo_create, value: "PKCESessionRepo.Create", stability: development}
        - {id: pkce_session_repo_delete, value: "PKCESessionRepo.Delete", stability: development}
        - {id: pkce_session_repo_delete_expired, value: "PKCESessionRepo.DeleteExpired", stability: development}
        - {id: pkce_session_repo_find_by_signature, value: "PKCESessionRepo.FindBySignature", stability: development}
        - {id: refresh_token_session_repo_create, value: "RefreshTokenSessionRepo.Create", stability: development}
        - {id: refresh_token_session_repo_delete_expired, value: "RefreshTokenSessionRepo.DeleteExpired", stability: development}
        - {id: refresh_token_session_repo_find_by_signature, value: "RefreshTokenSessionRepo.FindBySignature", stability: development}
        - {id: refresh_token_session_repo_mark_used, value: "RefreshTokenSessionRepo.MarkUsed", stability: development}
        - {id: refresh_token_session_repo_revoke_by_agent, value: "RefreshTokenSessionRepo.RevokeByAgent", stability: development}
        - {id: refresh_token_session_repo_revoke_by_principal_and_agent, value: "RefreshTokenSessionRepo.RevokeByPrincipalAndAgent", stability: development}
        - {id: refresh_token_session_repo_revoke_by_request_id, value: "RefreshTokenSessionRepo.RevokeByRequestID", stability: development}
        - {id: revoke_permanent_tool_approval, value: "RevokePermanentToolApproval", stability: development}
    brief: "Repository method name."
    stability: development
  - key: db.system
    type:
      members:
        - {id: postgresql, value: "postgresql", stability: development}
    brief: "Database system."
    stability: development
  - key: storage.outcome
    type:
      members:
        - {id: canceled, value: "canceled", brief: "The caller canceled the operation.", stability: development}
        - {id: conflict, value: "conflict", brief: "Operation conflicts with existing data.", stability: development}
        - {id: connection, value: "connection", brief: "Storage backend connection failed or disconnected.", stability: development}
        - {id: not_found, value: "not_found", brief: "Requested entity does not exist.", stability: development}
        - {id: timeout, value: "timeout", brief: "Operation exceeded its timeout deadline.", stability: development}
        - {id: unknown, value: "unknown", brief: "Error cause is unknown or unexpected.", stability: development}
        - {id: validation, value: "validation", brief: "Input validation failed.", stability: development}
    brief: "Result of a storage call that is not a failure. The span status stays unset."
    stability: development

attribute_groups:
  - id: attributes.storage.call
    visibility: internal
    attributes:
      - ref: db.system
      - ref: error.type
        examples: ["conflict", "connection", "not_found", "timeout", "unknown", "validation"]
      - ref: storage.outcome

spans:
  - type: storage.approve.tool_approval
